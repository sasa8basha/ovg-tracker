<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · سجل الإجراءات</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/shell.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #08090D; }
    body { font-family: 'Inter', 'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif; color: #CBD5E1; -webkit-font-smoothing: antialiased; overflow: hidden; }
    #shAppRoot { height: 100vh; width: 100vw; overflow: hidden; background: #08090D; }
    .db-shell-skel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: #08090D; color: #7B8496; font-size: 13px; z-index: 9998; }
    .db-shell-skel .spinner { width: 32px; height: 32px; border: 3px solid #232734; border-top-color: #7C5CFF; border-radius: 50%; animation: db-spin 0.8s linear infinite; }
    @keyframes db-spin { to { transform: rotate(360deg); } }

    .al-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .al-title { font-size: 22px; font-weight: 900; color: #F8FAFC; letter-spacing: -0.02em; margin: 0; }
    .al-sub { font-size: 12px; color: #7B8496; margin-top: 4px; }

    .al-tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid #232734; }
    .al-tab { padding: 10px 18px; background: transparent; border: none; border-bottom: 2px solid transparent; color: #7B8496; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; transition: all 120ms; }
    .al-tab.active { color: #F8FAFC; border-bottom-color: #7C5CFF; }
    .al-tab:hover { color: #CBD5E1; }
    .al-tab .count { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 1px 6px; border-radius: 3px; background: #161822; color: #7B8496; margin-right: 6px; }
    .al-tab.active .count { background: rgba(124,92,255,0.15); color: #9B80FF; }

    .al-filters { background: #0F1117; border: 1px solid #232734; border-radius: 12px; padding: 12px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
    @media (max-width: 900px) { .al-filters { grid-template-columns: 1fr 1fr; } }
    .al-filter-label { display: block; font-size: 10px; font-weight: 700; color: #4A5263; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .al-input { width: 100%; height: 32px; padding: 0 10px; background: #08090D; border: 1px solid #232734; border-radius: 6px; color: #F8FAFC; font-family: inherit; font-size: 12px; outline: none; }
    .al-input:focus { border-color: #7C5CFF; box-shadow: 0 0 0 3px rgba(124,92,255,0.12); }

    .al-list { background: #0F1117; border: 1px solid #232734; border-radius: 12px; overflow: hidden; }
    .al-row { display: grid; grid-template-columns: 80px 100px 1fr 150px 130px 90px; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid #1A1D29; transition: background 100ms; }
    .al-row:last-child { border-bottom: none; }
    .al-row:hover { background: #161822; }
    @media (max-width: 900px) { .al-row { grid-template-columns: 1fr; gap: 6px; } }

    .al-action-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
    .al-action-badge.blacklist { background: rgba(244,63,94,0.15); color: #F43F5E; }
    .al-action-badge.pause { background: rgba(245,158,11,0.15); color: #F59E0B; }
    .al-action-badge.scale { background: rgba(16,185,129,0.15); color: #10B981; }
    .al-action-badge.resume { background: rgba(59,130,246,0.15); color: #3B82F6; }
    .al-action-badge.unknown { background: rgba(148,163,184,0.15); color: #94A3B8; }

    .al-zone { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; color: #F8FAFC; padding: 2px 6px; background: #161822; border-radius: 4px; display: inline-block; }
    .al-reason { font-size: 12px; color: #CBD5E1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .al-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7B8496; }
    .al-user { font-size: 11px; color: #7B8496; }
    .al-meta { font-size: 10px; color: #4A5263; font-family: 'JetBrains Mono', monospace; }

    .al-undo-btn { padding: 4px 10px; border-radius: 6px; background: rgba(245,158,11,0.15); color: #F59E0B; border: 1px solid rgba(245,158,11,0.35); font-family: inherit; font-size: 11px; font-weight: 800; cursor: pointer; transition: all 120ms; }
    .al-undo-btn:hover { background: #F59E0B; color: white; }
    .al-undo-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .al-reverted { display: inline-block; padding: 3px 8px; border-radius: 4px; background: rgba(148,163,184,0.15); color: #94A3B8; font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

    .al-empty { padding: 60px 20px; text-align: center; color: #7B8496; }
    .al-empty-icon { font-size: 48px; opacity: 0.4; display: block; margin-bottom: 12px; }
    .al-empty-title { font-size: 16px; font-weight: 800; color: #F8FAFC; margin-bottom: 6px; }

    .al-skel { height: 60px; background: linear-gradient(90deg, #161822 0%, #232734 50%, #161822 100%); background-size: 1000px 100%; animation: al-shimmer 1.6s infinite linear; border-radius: 8px; margin-bottom: 8px; }
    @keyframes al-shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }

    .al-header-row { display: grid; grid-template-columns: 80px 100px 1fr 150px 130px 90px; gap: 12px; padding: 10px 16px; background: #0A0C12; border-bottom: 1px solid #1A1D29; font-size: 10px; font-weight: 800; color: #4A5263; text-transform: uppercase; letter-spacing: 0.05em; }
    @media (max-width: 900px) { .al-header-row { display: none; } }
  </style>
</head>
<body>

  <div class="db-shell-skel" id="bootSkeleton"><div class="spinner"></div><div>جاري التحميل…</div></div>

  <div id="shAppRoot" style="display:none;">
    <main id="shContent">
      <div class="al-header">
        <div>
          <h1 class="al-title">📜 سجل الإجراءات</h1>
          <p class="al-sub">كل إجراء اتاخد على الزونات — مين، امتى، وليه</p>
        </div>
        <button class="sh-btn sh-btn-ghost" id="refreshBtn" type="button">🔄 تحديث</button>
      </div>

      <div class="al-tabs">
        <button class="al-tab active" data-tab="active" type="button">
          <span class="count" id="tabActiveCount">0</span>
          🟢 نشطة
        </button>
        <button class="al-tab" data-tab="recent" type="button">
          <span class="count" id="tabRecentCount">0</span>
          🕐 الأخيرة
        </button>
      </div>

      <div class="al-filters">
        <div>
          <label class="al-filter-label">نوع الإجراء</label>
          <select id="fAction" class="al-input">
            <option value="">كل الأنواع</option>
            <option value="blacklist">🚫 حظر</option>
            <option value="pause">⏸ إيقاف</option>
            <option value="scale">📈 تكبير</option>
            <option value="resume">▶ استئناف</option>
          </select>
        </div>
        <div>
          <label class="al-filter-label">Zone</label>
          <input type="text" id="fZone" class="al-input" placeholder="فلترة بالـ zone">
        </div>
        <div>
          <label class="al-filter-label">بحث (reason)</label>
          <input type="text" id="fSearch" class="al-input" placeholder="فلترة سريعة...">
        </div>
        <button class="sh-btn sh-btn-ghost" id="clearBtn" type="button" style="height:32px;">مسح</button>
      </div>

      <div id="alLoading">
        <div class="al-skel"></div>
        <div class="al-skel"></div>
        <div class="al-skel"></div>
      </div>

      <div id="alList" class="al-list" style="display:none;">
        <div class="al-header-row">
          <span>الإجراء</span>
          <span>الزون</span>
          <span>السبب</span>
          <span>الوقت</span>
          <span>المستخدم</span>
          <span>إجراء</span>
        </div>
        <div id="alBody"></div>
      </div>

      <div id="alEmpty" class="al-empty" style="display:none;">
        <span class="al-empty-icon">📭</span>
        <div class="al-empty-title">مفيش إجراءات</div>
        <div style="font-size:12px;">لسه مفيش zone actions مسجلة.</div>
      </div>

      <div id="alError" class="al-empty" style="display:none;">
        <span class="al-empty-icon">⚠️</span>
        <div class="al-empty-title">فشل التحميل</div>
        <div style="font-size:12px;" id="alErrorMsg">—</div>
      </div>
    </main>
  </div>

  <script src="/static/js/shell.js"></script>
  <script>
    const AL = {
      tab: 'active',
      items: [],
      filters: { action: '', zone: '', search: '' },
      activeCount: 0,
      recentCount: 0,
    };

    const ACTION_LABELS = {
      blacklist: { label: '🚫 حظر', cls: 'blacklist' },
      pause: { label: '⏸ إيقاف', cls: 'pause' },
      scale: { label: '📈 تكبير', cls: 'scale' },
      resume: { label: '▶ استئناف', cls: 'resume' },
    };

    function actionBadge(action) {
      const m = ACTION_LABELS[action] || { label: action, cls: 'unknown' };
      return `<span class="al-action-badge ${m.cls}">${m.label}</span>`;
    }

    function formatTime(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        const now = new Date();
        const diffMs = now - d;
        const diffMin = Math.floor(diffMs / 60000);
        const diffH = Math.floor(diffMin / 60);
        const diffD = Math.floor(diffH / 24);

        if (diffMin < 1) return 'الآن';
        if (diffMin < 60) return `${diffMin} د`;
        if (diffH < 24) return `${diffH} س`;
        if (diffD < 7) return `${diffD} ي`;

        return d.toLocaleDateString('en-GB', { month: 'short', day: '2-digit' }) + ' ' +
               d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      } catch (e) { return '—'; }
    }

    function setView(view) {
      ['alLoading', 'alList', 'alEmpty', 'alError'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = id === view ? '' : 'none';
      });
    }

    function applyFilters(items) {
      let out = items;

      if (AL.filters.action) {
        out = out.filter(i => i.action === AL.filters.action);
      }
      if (AL.filters.zone) {
        const q = AL.filters.zone.toLowerCase();
        out = out.filter(i => (i.zone_id || '').toLowerCase().includes(q));
      }
      if (AL.filters.search) {
        const q = AL.filters.search.toLowerCase();
        out = out.filter(i =>
          (i.reason || '').toLowerCase().includes(q) ||
          (i.zone_id || '').toLowerCase().includes(q) ||
          (i.action || '').toLowerCase().includes(q)
        );
      }
      return out;
    }

    function renderList() {
      const filtered = applyFilters(AL.items);

      if (filtered.length === 0) {
        setView('alEmpty');
        return;
      }
      setView('alList');

      const body = document.getElementById('alBody');
      body.innerHTML = filtered.map(r => {
        const meta = r.metadata || {};
        let metaText = '';
        if (r.action === 'scale' && meta.percent) metaText = `+${meta.percent}%`;
        if (r.action === 'pause' && meta.hours) metaText = `${meta.hours}h`;

        const isActive = !r.reverted_at && AL.tab === 'active';
        const undoBtn = isActive
          ? `<button class="al-undo-btn" data-id="${r.id}" data-zone="${Shell.esc(r.zone_id)}" type="button">↩️ تراجع</button>`
          : (r.reverted_at ? '<span class="al-reverted">تم التراجع</span>' : '');

        return `
          <div class="al-row">
            <div>${actionBadge(r.action)}</div>
            <div><span class="al-zone">${Shell.esc(r.zone_id)}</span></div>
            <div>
              <div class="al-reason" title="${Shell.esc(r.reason || '')}">${Shell.esc(r.reason || '—')}</div>
              ${metaText ? `<div class="al-meta">${Shell.esc(metaText)}</div>` : ''}
            </div>
            <div class="al-time">${formatTime(r.timestamp)}</div>
            <div class="al-user">${Shell.esc(r.by || '—')}</div>
            <div>${undoBtn}</div>
          </div>`;
      }).join('');

      body.querySelectorAll('.al-undo-btn').forEach(btn => {
        btn.addEventListener('click', () => undoAction(btn.dataset.id, btn.dataset.zone));
      });
    }

    async function undoAction(actionId, zoneId) {
      const btn = document.querySelector(`.al-undo-btn[data-id="${actionId}"]`);
      if (btn) btn.disabled = true;

      try {
        await Shell.api(`/api/zones/${encodeURIComponent(zoneId)}/action/${actionId}`, { method: 'DELETE' });
        Shell.toast('تم التراجع ✅', 'success');
        await loadActions();
      } catch (e) {
        Shell.toast('فشل التراجع: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      }
    }

    async function loadActions() {
      setView('alLoading');

      try {
        if (AL.tab === 'active') {
          const [active, recent] = await Promise.all([
            Shell.api('/api/zones/actions/active'),
            Shell.api('/api/zones/actions/recent?limit=100'),
          ]);
          AL.items = (active.zones || []).map(z => ({
            id: null, // active endpoint doesn't return id
            zone_id: z.zone_id,
            action: z.action,
            reason: z.reason,
            metadata: z.metadata,
            timestamp: z.timestamp,
            reverted_at: null,
          }));
          AL.activeCount = AL.items.length;
          AL.recentCount = (recent.actions || []).length;
        } else {
          const recent = await Shell.api('/api/zones/actions/recent?limit=200');
          AL.items = recent.actions || [];
          AL.recentCount = AL.items.length;
          try {
            const active = await Shell.api('/api/zones/actions/active');
            AL.activeCount = (active.zones || []).length;
          } catch (e) {}
        }

        document.getElementById('tabActiveCount').textContent = AL.activeCount;
        document.getElementById('tabRecentCount').textContent = AL.recentCount;

        if (AL.items.length === 0) {
          setView('alEmpty');
          return;
        }
        renderList();
      } catch (e) {
        document.getElementById('alErrorMsg').textContent = e.message;
        setView('alError');
      }
    }

    function switchTab(tab) {
      AL.tab = tab;
      document.querySelectorAll('.al-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      loadActions();
    }

    (async function boot() {
      try {
        await Shell.mount({ active: 'audit-log', lang: 'ar', breadcrumb: [{ label: 'سجل الإجراءات' }] });
        document.getElementById('bootSkeleton').style.display = 'none';
        document.getElementById('shAppRoot').style.display = '';

        document.querySelectorAll('.al-tab').forEach(t => {
          t.addEventListener('click', () => switchTab(t.dataset.tab));
        });
        document.getElementById('refreshBtn').addEventListener('click', loadActions);
        document.getElementById('fAction').addEventListener('change', (e) => {
          AL.filters.action = e.target.value;
          renderList();
        });
        document.getElementById('fZone').addEventListener('input', (e) => {
          AL.filters.zone = e.target.value;
          renderList();
        });
        document.getElementById('fSearch').addEventListener('input', (e) => {
          AL.filters.search = e.target.value;
          renderList();
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
          AL.filters = { action: '', zone: '', search: '' };
          document.getElementById('fAction').value = '';
          document.getElementById('fZone').value = '';
          document.getElementById('fSearch').value = '';
          renderList();
        });

        await loadActions();
      } catch (e) {
        document.getElementById('bootSkeleton').innerHTML = `<div style="color:#F43F5E;">${Shell.esc(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
