<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · التقارير والخريطة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Leaflet + MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    body{font-family:'Cairo',sans-serif;background:var(--bg-page);color:var(--text-primary)}
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
    .tab-btn { padding: 10px 20px; border-radius: 10px; font-weight: 700; color: var(--text-secondary); cursor: pointer; border: none; background: transparent; transition: 0.2s; }
    .tab-btn.active { background: rgba(99,102,241,.15); color: var(--primary-500); }
    #map { height: 600px; width: 100%; border-radius: 1rem; z-index: 1; }
    .leaflet-container { background: #1e293b !important; }
    table { color: var(--text-primary); }
    thead { background: rgba(0,0,0,0.4) !important; color: var(--text-secondary); }
    tbody tr:hover { background: rgba(255,255,255,0.03) !important; }
    .ev-chip { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin: 1px; background: rgba(244,63,94,0.15); color: #fca5a5; }
    .date-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px 12px; border-radius: 10px; font-size: 14px; font-family: 'Cairo', sans-serif; }
    .date-input:focus { outline: none; border-color: var(--primary-500); }

    /* Customize marker cluster colors */
    .marker-cluster-small { background-color: rgba(16, 185, 129, 0.6); }
    .marker-cluster-small div { background-color: rgba(16, 185, 129, 0.9); color: white; font-weight: 700; }
    .marker-cluster-medium { background-color: rgba(245, 158, 11, 0.6); }
    .marker-cluster-medium div { background-color: rgba(245, 158, 11, 0.9); color: white; font-weight: 700; }
    .marker-cluster-large { background-color: rgba(244, 63, 94, 0.6); }
    .marker-cluster-large div { background-color: rgba(244, 63, 94, 0.9); color: white; font-weight: 700; }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <div>
          <h1 class="text-3xl font-extrabold text-white">التقارير والخريطة الحية</h1>
          <p class="text-slate-400 text-sm mt-1">تحليل جغرافي وتقني لتحسين الجودة</p>
        </div>
        <span id="filterIndicator" class="hidden px-3 py-1 text-xs bg-indigo-500/20 text-indigo-300 rounded-full font-bold">📅 فلتر تاريخ مفعّل</span>
      </div>
      <button onclick="window.location.href='/dashboard'" class="btn-ghost border border-slate-600">← العودة للداشبورد</button>
    </div>

    <!-- Phase R4 — Date filter bar -->
    <div class="glass rounded-2xl p-4 mb-6 flex gap-4 flex-wrap items-end">
      <div class="flex-1 min-w-[200px]">
        <label class="block text-xs font-bold text-slate-400 mb-1">📅 من تاريخ</label>
        <input type="date" id="filterFrom" class="date-input w-full">
      </div>
      <div class="flex-1 min-w-[200px]">
        <label class="block text-xs font-bold text-slate-400 mb-1">📅 إلى تاريخ</label>
        <input type="date" id="filterTo" class="date-input w-full">
      </div>
      <button onclick="applyDateFilters()" class="btn-primary">تطبيق الفلتر</button>
      <button onclick="clearDateFilters()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-bold text-sm transition">مسح</button>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 mb-6 border-b border-white/10 pb-4 flex-wrap">
      <button class="tab-btn active" data-tab="map" onclick="switchTab('map', this)">🗺️ الخريطة الحية</button>
      <button class="tab-btn" data-tab="countries" onclick="switchTab('countries', this)">🌍 الدول</button>
      <button class="tab-btn" data-tab="zones" onclick="switchTab('zones', this)">📊 الزونات</button>
      <button class="tab-btn" data-tab="tech" onclick="switchTab('tech', this)">💻 الأجهزة والمتصفحات</button>
    </div>

    <!-- Map -->
    <div id="tab-map" class="tab-content">
      <div class="glass rounded-2xl p-2">
        <div id="map"></div>
        <div id="mapStats" class="p-3 text-center text-sm text-slate-400"></div>
      </div>
    </div>

    <!-- Countries -->
    <div id="tab-countries" class="tab-content hidden">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass rounded-2xl p-6">
          <h2 class="text-sm font-bold text-white mb-6">أعلى 10 دول</h2>
          <div class="h-80"><canvas id="countryChart"></canvas></div>
        </div>
        <div class="glass rounded-2xl overflow-hidden">
          <table class="w-full text-sm text-right">
            <thead class="text-xs">
              <tr>
                <th class="px-3 py-3">الدولة</th>
                <th class="px-3 py-3">Code</th>
                <th class="px-3 py-3">إجمالي</th>
                <th class="px-3 py-3 text-emerald-400">صالح</th>
                <th class="px-3 py-3 text-amber-400">مشبوه</th>
                <th class="px-3 py-3 text-rose-400">بوتات</th>
                <th class="px-3 py-3">Bot %</th>
              </tr>
            </thead>
            <tbody id="countriesTable" class="divide-y divide-white/5"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Zones -->
    <div id="tab-zones" class="tab-content hidden">
      <div class="glass rounded-2xl overflow-hidden">
        <table class="w-full text-sm text-right">
          <thead class="text-xs">
            <tr>
              <th class="px-3 py-4">Zone</th>
              <th class="px-3 py-4">إجمالي</th>
              <th class="px-3 py-4 text-emerald-400">صالح</th>
              <th class="px-3 py-4 text-amber-400">مشبوه</th>
              <th class="px-3 py-4 text-rose-400">بوتات</th>
              <th class="px-3 py-4">Bot %</th>
              <th class="px-3 py-4">Grade</th>
              <th class="px-3 py-4">أشهر أسباب البوت</th>
            </tr>
          </thead>
          <tbody id="zonesTable" class="divide-y divide-white/5"></tbody>
        </table>
      </div>
      <p class="text-xs text-slate-500 mt-3">* Grade يعتمد على عينة ≥ 10 زيارات. الأقل من ذلك يظهر بـ <code>?</code></p>
    </div>

    <!-- Tech -->
    <div id="tab-tech" class="tab-content hidden">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass rounded-2xl p-6">
          <h2 class="text-sm font-bold text-white mb-6">الأجهزة (حسب الحكم)</h2>
          <div class="h-80"><canvas id="deviceChart"></canvas></div>
        </div>
        <div class="glass rounded-2xl p-6">
          <h2 class="text-sm font-bold text-white mb-6">المتصفحات (حسب الحكم)</h2>
          <div class="h-80"><canvas id="browserChart"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const siteKey = new URL(location.href).searchParams.get('site');
    let map = null;
    let clusterGroup = null;
    let charts = {};
    let currentTab = 'map';
    let dateFilters = { from: null, to: null };

    const EVIDENCE_I18N = {
        WEBDRIVER_FLAG: "WebDriver", CDP_DETECTED: "CDP",
        WINDOWS_UA_LINUX: "UA/OS تضارب", FIREFOX_CHROME_OBJ: "Firefox+Chrome",
        BOT_UA: "UA بوت", VPN_DATACENTER: "VPN+DC",
        WEBRTC_LEAK: "WebRTC Leak", PLUGINS_ZERO: "plugins=0",
        CHROME_NO_OBJ: "window.chrome", FINGERPRINT_REUSE_HIGH: "بصمة متكررة",
        FINGERPRINT_REUSE_MED: "بصمة متكررة", FINGERPRINT_REUSE_LOW: "بصمة متكررة",
        ROBOTIC_LINEAR: "ماوس خطي", DATACENTER_IP: "Datacenter",
        VPN_PROXY: "VPN", CANVAS_MISSING: "Canvas مفقود",
        LANGUAGES_EMPTY: "languages فاضي", LOW_CPU: "CPU منخفض",
        TZ_MISMATCH: "توقيت مضطرب", MOBILE_WIDE_SCREEN: "شاشة غريبة",
        ROBOTIC_CURVATURE: "انحناء صفر", ROBOTIC_VARIANCE: "تباين منخفض",
        OS_MISMATCH_WIN: "OS mismatch", OS_MISMATCH_MAC: "OS mismatch",
        LEFT_FAST: "خرج سريع", UTC_TZ: "UTC",
        CANVAS_BLOCKED: "Canvas blocked", SINGLE_LANG: "لغة واحدة",
        SOFT_RENDERER: "Software render", ZOMBIE: "بدون تفاعل",
    };

    function evLabel(code) { return EVIDENCE_I18N[code] || code; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // ============ URL Builder ============
    function buildUrl(base) {
      const params = new URLSearchParams();
      if (siteKey) params.set('site', siteKey);
      if (dateFilters.from) params.set('from_date', dateFilters.from);
      if (dateFilters.to) params.set('to_date', dateFilters.to);
      const qs = params.toString();
      return qs ? base + '?' + qs : base;
    }

    // ============ Date Filters ============
    function applyDateFilters() {
      dateFilters.from = document.getElementById('filterFrom').value || null;
      dateFilters.to = document.getElementById('filterTo').value || null;
      updateFilterIndicator();
      reloadCurrentTab();
    }

    function clearDateFilters() {
      document.getElementById('filterFrom').value = '';
      document.getElementById('filterTo').value = '';
      dateFilters.from = null;
      dateFilters.to = null;
      updateFilterIndicator();
      reloadCurrentTab();
    }

    function updateFilterIndicator() {
      const ind = document.getElementById('filterIndicator');
      if (dateFilters.from || dateFilters.to) ind.classList.remove('hidden');
      else ind.classList.add('hidden');
    }

    function reloadCurrentTab() {
      if (currentTab === 'map') loadMap();
      else if (currentTab === 'countries') loadCountries();
      else if (currentTab === 'zones') loadZones();
      else if (currentTab === 'tech') loadTech();
    }

    function switchTab(tabId, btn) {
      currentTab = tabId;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      btn.classList.add('active');
      if (tabId === 'map') setTimeout(loadMap, 100);
      if (tabId === 'countries') loadCountries();
      if (tabId === 'zones') loadZones();
      if (tabId === 'tech') loadTech();
    }

    // ============ Map (Phase R4: markercluster) ============
    async function loadMap() {
      if (!map) {
        map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          subdomains: 'abcd', maxZoom: 19
        }).addTo(map);
      }

      // Clear previous cluster
      if (clusterGroup) {
        map.removeLayer(clusterGroup);
        clusterGroup = null;
      }

      // Phase R4 — [R17] MarkerCluster group
      clusterGroup = L.markerClusterGroup({
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
      });

      let url = buildUrl('/api/map/visits');
      const r = await fetch(url);
      if (!r.ok) {
        document.getElementById('mapStats').textContent = 'فشل تحميل الزيارات';
        return;
      }
      const data = await r.json();

      data.forEach(v => {
        let color = v.verdict === 'valid' ? '#10b981' : v.verdict === 'invalid' ? '#f43f5e' : '#f59e0b';
        const marker = L.circleMarker([v.lat, v.lng], {
          radius: 6,
          fillColor: color,
          color: '#fff',
          weight: 1,
          opacity: 1,
          fillOpacity: 0.85
        });
        marker.bindPopup(`<b>${esc(v.country)}</b><br>IP: ${esc(v.ip)}<br>Status: <b>${esc(v.verdict).toUpperCase()}</b>`);
        clusterGroup.addLayer(marker);
      });

      map.addLayer(clusterGroup);
      document.getElementById('mapStats').textContent = `${data.length} زيارة معروضة على الخريطة (بحد أقصى 1000)`;
    }

    // ============ Countries ============
    async function loadCountries() {
      let url = buildUrl('/api/reports/countries');
      const r = await fetch(url);
      if (!r.ok) return;
      const data = await r.json();

      if (charts.country) charts.country.destroy();
      const top = data.slice(0, 10);

      charts.country = new Chart(document.getElementById('countryChart'), {
        type: 'bar',
        data: {
          labels: top.map(d => d.code || d.name),
          datasets: [
            { label: 'صالح', data: top.map(d => d.valid), backgroundColor: '#10b981', stack: 'v', borderRadius: 3 },
            { label: 'مشبوه', data: top.map(d => d.suspicious), backgroundColor: '#f59e0b', stack: 'v', borderRadius: 3 },
            { label: 'بوتات', data: top.map(d => d.invalid), backgroundColor: '#f43f5e', stack: 'v', borderRadius: 3 },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#cbd5e1', font: { family: 'Cairo' } } } },
          scales: {
            x: { stacked: true, ticks: { color: '#cbd5e1' } },
            y: { stacked: true, ticks: { color: '#cbd5e1' } }
          }
        }
      });

      document.getElementById('countriesTable').innerHTML = data.map(d => `
        <tr>
          <td class="px-3 py-3 font-bold text-white">${esc(d.name)}</td>
          <td class="px-3 py-3 font-mono text-xs text-indigo-300">${esc(d.code || '—')}</td>
          <td class="px-3 py-3 text-slate-300">${d.total}</td>
          <td class="px-3 py-3 text-emerald-400">${d.valid}</td>
          <td class="px-3 py-3 text-amber-400">${d.suspicious}</td>
          <td class="px-3 py-3 text-rose-400 font-bold">${d.invalid}</td>
          <td class="px-3 py-3 ${d.bot_rate > 30 ? 'text-rose-400' : d.bot_rate > 15 ? 'text-amber-400' : 'text-emerald-400'} font-bold">${d.bot_rate}%</td>
        </tr>
      `).join('') || '<tr><td colspan="7" class="text-center py-10 text-slate-500">لا توجد بيانات</td></tr>';
    }

    // ============ Zones ============
    async function loadZones() {
      let url = buildUrl('/api/reports/zones');
      const r = await fetch(url);
      if (!r.ok) return;
      const data = await r.json();

      const gradeColor = g => ({
        'A': 'text-emerald-400 bg-emerald-500/10',
        'B': 'text-blue-400 bg-blue-500/10',
        'C': 'text-amber-400 bg-amber-500/10',
        'F': 'text-rose-400 bg-rose-500/10',
        '?': 'text-slate-400 bg-slate-500/10',
      }[g] || 'text-slate-400');

      document.getElementById('zonesTable').innerHTML = data.map(z => {
        const evChips = (z.top_evidence || []).map(e =>
          `<span class="ev-chip">${esc(evLabel(e.code))} ×${e.count}</span>`
        ).join('') || '<span class="text-slate-500 text-xs">—</span>';

        return `
        <tr>
          <td class="px-3 py-3 font-mono text-white">${esc(z.zone)}</td>
          <td class="px-3 py-3 text-slate-300">${z.total}</td>
          <td class="px-3 py-3 text-emerald-400">${z.valid}</td>
          <td class="px-3 py-3 text-amber-400">${z.suspicious}</td>
          <td class="px-3 py-3 text-rose-400 font-bold">${z.invalid}</td>
          <td class="px-3 py-3 ${z.bot_rate > 30 ? 'text-rose-400' : z.bot_rate > 15 ? 'text-amber-400' : 'text-emerald-400'} font-bold">${z.bot_rate}%</td>
          <td class="px-3 py-3"><span class="px-2 py-1 rounded font-bold text-xs ${gradeColor(z.grade)}">${z.grade}</span></td>
          <td class="px-3 py-3 text-right">${evChips}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="8" class="text-center py-10 text-slate-500">لا توجد بيانات</td></tr>';
    }

    // ============ Tech ============
    async function loadTech() {
      let url = buildUrl('/api/reports/tech');
      const r = await fetch(url);
      if (!r.ok) return;
      const data = await r.json();

      if (charts.device) charts.device.destroy();
      if (charts.browser) charts.browser.destroy();

      const mkChart = (ctx, items) => new Chart(ctx, {
        type: 'bar',
        data: {
          labels: items.map(d => d.name),
          datasets: [
            { label: 'صالح', data: items.map(d => d.valid), backgroundColor: '#10b981', stack: 'v', borderRadius: 3 },
            { label: 'مشبوه', data: items.map(d => d.suspicious), backgroundColor: '#f59e0b', stack: 'v', borderRadius: 3 },
            { label: 'بوتات', data: items.map(d => d.invalid), backgroundColor: '#f43f5e', stack: 'v', borderRadius: 3 },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#cbd5e1', font: { family: 'Cairo' } } } },
          scales: {
            x: { stacked: true, ticks: { color: '#cbd5e1', font: { family: 'Cairo' } } },
            y: { stacked: true, ticks: { color: '#cbd5e1' } }
          }
        }
      });

      charts.device = mkChart(document.getElementById('deviceChart'), data.devices);
      charts.browser = mkChart(document.getElementById('browserChart'), data.browsers);
    }

    // Init
    loadMap();
  </script>
</body>
  </html>
