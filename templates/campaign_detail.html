<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · تفاصيل الحملة</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/shell.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #08090D; }
    body { font-family: 'Inter', 'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif; color: #CBD5E1; -webkit-font-smoothing: antialiased; overflow: hidden; }
    #shAppRoot { height: 100vh; width: 100vw; overflow: hidden; background: #08090D; }
    .db-shell-skel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: #08090D; color: #7B8496; z-index: 9998; }
    .db-shell-skel .spinner { width: 32px; height: 32px; border: 3px solid #232734; border-top-color: #7C5CFF; border-radius: 50%; animation: db-spin 0.8s linear infinite; }
    @keyframes db-spin { to { transform: rotate(360deg); } }

    .cd-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .cd-title { font-size: 22px; font-weight: 900; color: #F8FAFC; margin: 0 0 6px 0; }
    .cd-sub { font-size: 12px; color: #7B8496; display: flex; align-items: center; gap: 8px; }
    .cd-badge { padding: 3px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .cd-badge.active { background: rgba(16,185,129,0.15); color: #10B981; }
    .cd-badge.paused { background: rgba(245,158,11,0.15); color: #F59E0B; }
    
    .cd-hero { background: linear-gradient(135deg, #0F1117 0%, #161822 100%); border: 1px solid #232734; border-radius: 16px; padding: 22px 26px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr auto; gap: 24px; position: relative; overflow: hidden; }
    .cd-hero::before { content: ''; position: absolute; top: -50%; right: -30%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(34,211,238,0.2) 0%, transparent 70%); pointer-events: none; }
    .cd-hero.neg::before { background: radial-gradient(circle, rgba(244,63,94,0.2) 0%, transparent 70%); }
    .cd-hero-label { font-size: 10px; font-weight: 700; color: #7B8496; text-transform: uppercase; letter-spacing: 0.1em; }
    .cd-hero-val { font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 900; line-height: 1; margin-top: 8px; letter-spacing: -0.03em; color: #22D3EE; font-feature-settings: "tnum"; }
    .cd-hero.neg .cd-hero-val { color: #F43F5E; }
    .cd-hero-roi { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .cd-hero-roi.pos { background: rgba(34,211,238,0.12); color: #22D3EE; }
    .cd-hero-roi.neg { background: rgba(244,63,94,0.12); color: #F43F5E; }
    .cd-hero-stats { display: grid; grid-template-columns: repeat(3, auto); gap: 24px; align-items: end; position: relative; }
    .cd-hero-stat-label { font-size: 9px; color: #4A5263; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .cd-hero-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800; color: #F8FAFC; }
    
    .cd-section { background: #0F1117; border: 1px solid #232734; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
    .cd-section-title { font-size: 12px; font-weight: 800; color: #F8FAFC; margin: 0 0 12px 0; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
    
    .cd-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .cd-info-item { padding: 10px 12px; background: #161822; border-radius: 8px; }
    .cd-info-label { font-size: 10px; color: #4A5263; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .cd-info-value { font-size: 13px; color: #F8FAFC; font-weight: 700; font-family: 'JetBrains Mono', monospace; word-break: break-all; }
    
    .cd-code-box { background: #08090D; border: 1px solid #232734; border-radius: 8px; padding: 14px; position: relative; margin-top: 10px; }
    .cd-code-box pre { margin: 0; color: #10B981; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; max-height: 250px; overflow-y: auto; }
    .cd-copy-btn { position: absolute; top: 10px; left: 10px; height: 28px; padding: 0 12px; background: #7C5CFF; color: white; border: none; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 120ms; }
    .cd-copy-btn:hover { background: #9B80FF; }
    .cd-copy-btn.copied { background: #10B981; }
    
    .cd-url-box { padding: 12px; background: #08090D; border: 1px solid #232734; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #10B981; word-break: break-all; margin-top: 8px; }
    
    .cd-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="db-shell-skel" id="bootSkeleton"><div class="spinner"></div><div>جاري التحميل…</div></div>

  <div id="shAppRoot" style="display:none;">
    <main id="shContent">
      <div class="cd-header">
        <div>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
            <h1 class="cd-title" id="cdTitle">—</h1>
            <span id="cdBadge" class="cd-badge">—</span>
          </div>
          <div class="cd-sub" id="cdSub">—</div>
        </div>
        <a href="/campaigns" class="sh-btn sh-btn-ghost">← كل الحملات</a>
      </div>

      <div id="cdLoading" style="text-align:center;padding:40px;color:#7B8496;">جاري التحميل…</div>

      <div id="cdContent" style="display:none;">
        <div class="cd-hero" id="cdHero">
          <div><div class="cd-hero-label">صافي الربح</div><div class="cd-hero-val" id="heroProfit">$0.00</div><div class="cd-hero-roi pos" id="heroRoi">ROI 0%</div></div>
          <div class="cd-hero-stats">
            <div><div class="cd-hero-stat-label">التكلفة</div><div class="cd-hero-stat-val" id="heroCost">$0.00</div></div>
            <div><div class="cd-hero-stat-label">الإيراد</div><div class="cd-hero-stat-val" id="heroRev">$0.00</div></div>
            <div><div class="cd-hero-stat-label">الزيارات</div><div class="cd-hero-stat-val" id="heroTotal">0</div></div>
          </div>
        </div>

        <div class="cd-section">
          <h3 class="cd-section-title">⚙️ الإعدادات</h3>
          <div class="cd-info-grid">
            <div class="cd-info-item"><div class="cd-info-label">المصدر</div><div class="cd-info-value" id="infoSource">—</div></div>
            <div class="cd-info-item"><div class="cd-info-label">الوجهة</div><div class="cd-info-value" id="infoDest">—</div></div>
            <div class="cd-info-item"><div class="cd-info-label">Buy CPM</div><div class="cd-info-value" id="infoBuyCpm">$0.00</div></div>
            <div class="cd-info-item"><div class="cd-info-label">Sell CPM</div><div class="cd-info-value" id="infoSellCpm">$0.00</div></div>
          </div>
        </div>

        <div class="cd-section" id="trackingSection">
          <h3 class="cd-section-title" id="trackingTitle">🔗 كود التتبع / الرابط</h3>
          <div id="trackingBody"></div>
        </div>

        <div class="cd-section">
          <h3 class="cd-section-title">🎬 الإجراءات</h3>
          <div class="cd-actions">
            <a href="/visits?campaign_id=" id="btnViewVisits" class="sh-btn sh-btn-ghost">👁 عرض الزيارات</a>
            <button class="sh-btn sh-btn-ghost" id="btnRotateKey">🔄 تجديد المفتاح</button>
            <button class="sh-btn sh-btn-danger" id="btnTogglePause">⏸ إيقاف</button>
            <button class="sh-btn sh-btn-danger" id="btnDelete" style="background:rgba(244,63,94,0.15);border-color:rgba(244,63,94,0.3);">🗑 حذف الحملة</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/shell.js"></script>
  <script>
    const CD = { campaignId: null, data: null };

    function fmtMoney(n) { const v = Number(n || 0); if (Math.abs(v) < 0.005) return '$0.00'; return (v >= 0 ? '+' : '-') + '$' + Math.abs(v).toFixed(2); }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent; btn.textContent = '✓ تم'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
      }).catch(() => Shell.toast('فشل النسخ', 'error'));
    }

    async function renderTracking(c) {
      const body = document.getElementById('trackingBody');
      
      if (c.type === 'direct') {
        document.getElementById('trackingTitle').textContent = '🔗 رابط التتبع المباشر (Direct Link)';
        const url = `${window.location.origin}/go/${c.campaign_key}`;
        body.innerHTML = `
          <div style="font-size:12px;color:#CBD5E1;margin-bottom:8px;">استخدم هذا الرابط في حملة ${Shell.esc(c.traffic_source_slug)}. الزوار سيتم توجيههم إلى ${Shell.esc(c.destination_slug)} بعد الفحص.</div>
          <div class="cd-url-box">${Shell.esc(url)}</div>
          <div style="margin-top:12px;"><button class="sh-btn sh-btn-primary" id="copyUrlBtn">📋 نسخ الرابط</button></div>
        `;
        document.getElementById('copyUrlBtn').onclick = function() { copyText(url, this); };
        
      } else {
        document.getElementById('trackingTitle').textContent = '🔧 كود التتبع (Tracking Code)';
        body.innerHTML = `<div style="font-size:12px;color:#7B8496;text-align:center;padding:20px;">جاري جلب الكود...</div>`;
        
        try {
          const codeData = await Shell.api(`/api/campaigns/${c.id}/tracker-code-v3`);
          body.innerHTML = `
            <div style="font-size:12px;color:#CBD5E1;margin-bottom:8px;">ضع هذا الكود في صفحة الهبوط (Landing Page) الخاصة بهذه الحملة.</div>
            <div class="cd-code-box">
              <button class="cd-copy-btn" id="copyCodeBtn">📋 نسخ الكود</button>
              <pre id="codeBlock">${Shell.esc(codeData.full)}</pre>
            </div>
            <div style="font-size:10px;color:#4A5263;margin-top:8px;">حجم الكود: ${Math.round(codeData.size_bytes / 1024)} KB · ${codeData.lines} سطر</div>
          `;
          document.getElementById('copyCodeBtn').onclick = function() { copyText(codeData.full, this); };
        } catch (e) {
          body.innerHTML = `<div style="color:#F43F5E;font-size:12px;">فشل جلب الكود: ${Shell.esc(e.message)}</div>`;
        }
      }
    }

    async function loadCampaign() {
      try {
        CD.data = await Shell.api('/api/campaigns/' + CD.campaignId);
        const c = CD.data;
        
        document.getElementById('cdTitle').textContent = c.name;
        const badge = document.getElementById('cdBadge');
        badge.className = 'cd-badge ' + c.status;
        badge.textContent = c.status === 'active' ? 'نشطة' : c.status === 'paused' ? 'موقوفة' : 'مؤرشفة';
        
        document.getElementById('cdSub').innerHTML = `<span>${Shell.esc(c.type)}</span> · <span>${Shell.esc(c.traffic_source_slug)} → ${Shell.esc(c.destination_slug)}</span>`;
        document.getElementById('infoSource').textContent = c.traffic_source_slug;
        document.getElementById('infoDest').textContent = c.destination_slug;
        document.getElementById('infoBuyCpm').textContent = '$' + Number(c.buy_cpm).toFixed(2);
        document.getElementById('infoSellCpm').textContent = '$' + Number(c.sell_cpm).toFixed(2);
        document.getElementById('btnViewVisits').href = '/visits?campaign_id=' + c.id;
        
        const st = c.stats || {}; const pl = st.pl || { profit: 0, roi: 0 };
        document.getElementById('heroProfit').textContent = fmtMoney(pl.profit);
        document.getElementById('heroCost').textContent = '$' + Number(pl.cost || 0).toFixed(2);
        document.getElementById('heroRev').textContent = '$' + Number(pl.revenue || 0).toFixed(2);
        document.getElementById('heroTotal').textContent = Shell.fmtNum(st.total || 0);
        
        const roiEl = document.getElementById('heroRoi');
        roiEl.textContent = `ROI ${pl.roi >= 0 ? '+' : ''}${Number(pl.roi || 0).toFixed(1)}%`;
        roiEl.className = 'cd-hero-roi ' + (pl.profit >= 0 ? 'pos' : 'neg');
        
        await renderTracking(c);
        
        document.getElementById('cdLoading').style.display = 'none';
        document.getElementById('cdContent').style.display = '';
      } catch (e) {
        document.getElementById('cdLoading').innerHTML = `<span style="color:#F43F5E;">فشل التحميل: ${Shell.esc(e.message)}</span>`;
      }
    }

    async function togglePause() {
      const newStatus = CD.data.status === 'active' ? 'paused' : 'active';
      try {
        await Shell.api('/api/campaigns/' + CD.campaignId, { method: 'PATCH', body: JSON.stringify({ status: newStatus }) });
        Shell.toast('تم التحديث', 'success'); loadCampaign();
      } catch (e) { Shell.toast('فشل', 'error'); }
    }

    async function rotateKey() {
      if (!confirm('تجديد المفتاح هيبطّل الكود/الرابط القديم. متأكد؟')) return;
      try { await Shell.api('/api/campaigns/' + CD.campaignId + '/rotate-key', { method: 'POST' }); Shell.toast('تم التجديد', 'success'); loadCampaign(); }
      catch (e) { Shell.toast('فشل', 'error'); }
    }

    async function deleteCampaign() {
      if (!confirm('هتحذف الحملة وكل زياراتها. متأكد؟')) return;
      try { await Shell.api('/api/campaigns/' + CD.campaignId, { method: 'DELETE' }); Shell.toast('تم الحذف', 'success'); setTimeout(() => window.location.href = '/campaigns', 500); }
      catch (e) { Shell.toast('فشل', 'error'); }
    }

    (async function boot() {
      try {
        CD.campaignId = parseInt(window.location.pathname.split('/').pop()) || 0;
        await Shell.mount({ active: 'campaigns', lang: 'ar', breadcrumb: [{ label: 'الحملات', href: '/campaigns' }, { label: 'تفاصيل' }] });
        document.getElementById('bootSkeleton').style.display = 'none'; document.getElementById('shAppRoot').style.display = '';
        
        document.getElementById('btnTogglePause').addEventListener('click', togglePause);
        document.getElementById('btnRotateKey').addEventListener('click', rotateKey);
        document.getElementById('btnDelete').addEventListener('click', deleteCampaign);
        
        await loadCampaign();
      } catch (e) { document.getElementById('bootSkeleton').innerHTML = `<div style="color:#F43F5E;">${Shell.esc(e.message)}</div>`; }
    })();
  </script>
</body>
</html>
