<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · Sessions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/shell.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #08090D; }
    body { font-family: 'Inter', 'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif; color: #CBD5E1; -webkit-font-smoothing: antialiased; overflow: hidden; }
    #shAppRoot { height: 100vh; width: 100vw; overflow: hidden; background: #08090D; }
    .db-shell-skel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: #08090D; color: #7B8496; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 13px; z-index: 9998; }
    .db-shell-skel .spinner { width: 32px; height: 32px; border: 3px solid #232734; border-top-color: #7C5CFF; border-radius: 50%; animation: db-spin 0.8s linear infinite; }
    @keyframes db-spin { to { transform: rotate(360deg); } }

    .ss-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .ss-title { font-size: 22px; font-weight: 900; color: #F8FAFC; letter-spacing: -0.02em; margin: 0; }
    .ss-sub { font-size: 12px; color: #7B8496; margin-top: 4px; }

    .ss-compare { background: linear-gradient(135deg, #0F1117 0%, #161822 100%); border: 1px solid #232734; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    .ss-compare-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
    .ss-compare-title { font-size: 13px; font-weight: 800; color: #F8FAFC; display: flex; align-items: center; gap: 8px; }
    .ss-compare-badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-weight: 800; }
    .ss-compare-badge.ready { background: rgba(16,185,129,0.15); color: #10B981; }
    .ss-compare-badge.warn { background: rgba(245,158,11,0.15); color: #F59E0B; }
    .ss-compare-badge.bad { background: rgba(244,63,94,0.15); color: #F43F5E; }
    .ss-compare-badge.info { background: rgba(124,92,255,0.15); color: #9B80FF; }

    .ss-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .ss-group { background: #08090D; border: 1px solid #232734; border-radius: 10px; padding: 12px; }
    .ss-group-label { font-size: 10px; color: #4A5263; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 6px; }
    .ss-group-val { font-size: 20px; font-weight: 900; font-family: 'JetBrains Mono', monospace; color: #F8FAFC; line-height: 1.1; }
    .ss-group-sub { font-size: 10px; color: #7B8496; margin-top: 3px; font-family: 'JetBrains Mono', monospace; }
    .ss-group.legacy .ss-group-val { color: #F59E0B; }
    .ss-group.full .ss-group-val { color: #10B981; }
    .ss-group.partial .ss-group-val { color: #93C5FD; }

    .ss-diagnostic { background: rgba(124,92,255,0.08); border: 1px solid rgba(124,92,255,0.25); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #C4B5FD; line-height: 1.6; }
    .ss-diagnostic.ready { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.25); color: #6EE7B7; }
    .ss-diagnostic.warn { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.25); color: #FCD34D; }
    .ss-diagnostic.bad { background: rgba(244,63,94,0.08); border-color: rgba(244,63,94,0.25); color: #FDA4AF; }

    .ss-filters { background: #0F1117; border: 1px solid #232734; border-radius: 12px; padding: 12px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 8px; align-items: end; }
    @media (max-width: 900px) { .ss-filters { grid-template-columns: repeat(2, 1fr); } }
    .ss-filter-label { display: block; font-size: 10px; font-weight: 700; color: #4A5263; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .ss-input { width: 100%; height: 32px; padding: 0 10px; background: #08090D; border: 1px solid #232734; border-radius: 6px; color: #F8FAFC; font-family: inherit; font-size: 12px; outline: none; transition: border-color 120ms; }
    .ss-input:focus { border-color: #7C5CFF; box-shadow: 0 0 0 3px rgba(124,92,255,0.12); }

    .ss-list { display: flex; flex-direction: column; gap: 8px; }
    .ss-item { background: #0F1117; border: 1px solid #232734; border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: all 120ms; text-decoration: none; color: inherit; display: grid; grid-template-columns: 110px 1fr 90px 90px 110px; gap: 12px; align-items: center; }
    .ss-item:hover { border-color: #7C5CFF; background: #161822; transform: translateX(-2px); }
    @media (max-width: 900px) { .ss-item { grid-template-columns: 1fr; gap: 6px; } }

    .ss-item-sid { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #9B80FF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ss-item-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
    .ss-meta-chip { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
    .ss-meta-chip.dq-full { background: rgba(16,185,129,0.15); color: #10B981; }
    .ss-meta-chip.dq-partial { background: rgba(59,130,246,0.15); color: #93C5FD; }
    .ss-meta-chip.dq-legacy { background: rgba(245,158,11,0.15); color: #F59E0B; }
    .ss-meta-chip.dq-unknown, .ss-meta-chip.dq-pending { background: rgba(124,92,255,0.1); color: #9B80FF; }
    .ss-meta-chip.verdict-valid { background: rgba(16,185,129,0.12); color: #10B981; }
    .ss-meta-chip.verdict-invalid { background: rgba(244,63,94,0.12); color: #F43F5E; }
    .ss-meta-chip.verdict-suspicious { background: rgba(245,158,11,0.12); color: #F59E0B; }
    .ss-meta-chip.verdict-pending { background: rgba(255,255,255,0.05); color: #7B8496; }
    .ss-meta-text { font-size: 11px; color: #7B8496; }

    .ss-item-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7B8496; text-align: center; }
    .ss-item-duration { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #F8FAFC; text-align: center; }
    .ss-item-hb { text-align: center; }
    .ss-item-hb-count { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; color: #22D3EE; }
    .ss-item-hb-label { font-size: 9px; color: #4A5263; text-transform: uppercase; letter-spacing: 0.05em; }

    .ss-empty { padding: 60px 20px; text-align: center; color: #7B8496; }
    .ss-empty-icon { font-size: 48px; opacity: 0.4; display: block; margin-bottom: 12px; }
    .ss-empty-title { font-size: 16px; font-weight: 800; color: #F8FAFC; margin-bottom: 6px; }

    .ss-pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 0 4px; flex-wrap: wrap; gap: 8px; }
    .ss-pagination-info { font-size: 12px; color: #7B8496; font-family: 'JetBrains Mono', monospace; }
    .ss-pagination-controls { display: flex; gap: 6px; align-items: center; }
    .ss-page-btn { height: 30px; padding: 0 12px; border-radius: 6px; background: transparent; border: 1px solid #232734; color: #CBD5E1; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 120ms; }
    .ss-page-btn:hover:not(:disabled) { background: #161822; border-color: #2E3446; color: #F8FAFC; }
    .ss-page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .ss-page-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #F8FAFC; font-weight: 800; min-width: 60px; text-align: center; }

    .ss-skel { height: 64px; border-radius: 10px; background: linear-gradient(90deg, #161822 0%, #232734 50%, #161822 100%); background-size: 1000px 100%; animation: ss-shimmer 1.6s infinite linear; margin-bottom: 8px; }
    @keyframes ss-shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
  </style>
</head>
<body>

  <div class="db-shell-skel" id="bootSkeleton">
    <div class="spinner"></div>
    <div>جاري التحميل…</div>
  </div>

  <div id="shAppRoot" style="display:none;">
    <main id="shContent">
      <div class="ss-header">
        <div>
          <h1 class="ss-title">📊 Sessions</h1>
          <p class="ss-sub" id="ssSub">عرض وتحليل الـ sessions المسجلة</p>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="sh-btn sh-btn-ghost" id="refreshBtn" type="button">🔄 تحديث</button>
        </div>
      </div>

      <div class="ss-compare" id="compareCard" style="display:none;">
        <div class="ss-compare-head">
          <div class="ss-compare-title">
            🧪 مقارنة v2 vs v3
          </div>
          <div id="compareBadge"></div>
        </div>
        <div class="ss-groups" id="compareGroups"></div>
        <div class="ss-diagnostic" id="compareDiagnostic">—</div>
      </div>

      <div class="ss-filters">
        <div>
          <label class="ss-filter-label">الحالة (Data Quality)</label>
          <select id="fDq" class="ss-input">
            <option value="">الكل</option>
            <option value="full">Full (v3)</option>
            <option value="partial">Partial</option>
            <option value="pending">Pending (لسه شغال)</option>
            <option value="legacy">Legacy (v2)</option>
          </select>
        </div>
        <div>
          <label class="ss-filter-label">من تاريخ</label>
          <input type="date" id="fFrom" class="ss-input">
        </div>
        <div>
          <label class="ss-filter-label">إلى تاريخ</label>
          <input type="date" id="fTo" class="ss-input">
        </div>
        <div>
          <label class="ss-filter-label">الحكم</label>
          <select id="fVerdict" class="ss-input">
            <option value="">الكل</option>
            <option value="valid">Valid</option>
            <option value="invalid">Invalid</option>
            <option value="suspicious">Suspicious</option>
          </select>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="sh-btn sh-btn-primary" id="applyBtn" type="button" style="height:32px;">تطبيق</button>
          <button class="sh-btn sh-btn-ghost" id="clearBtn" type="button" style="height:32px;">مسح</button>
        </div>
      </div>

      <div id="loadingView">
        <div class="ss-skel"></div>
        <div class="ss-skel"></div>
        <div class="ss-skel"></div>
      </div>

      <div id="listView" class="ss-list" style="display:none;"></div>

      <div id="emptyView" class="ss-empty" style="display:none;">
        <span class="ss-empty-icon">📭</span>
        <div class="ss-empty-title">مفيش sessions</div>
        <div style="font-size:12px;">لسه مجاش زيارات. ركّب كود v3 واختبر.</div>
      </div>

      <div id="paginationView" class="ss-pagination" style="display:none;">
        <div class="ss-pagination-info" id="pageInfo">—</div>
        <div class="ss-pagination-controls">
          <button class="ss-page-btn" id="prevBtn" type="button">← السابق</button>
          <span class="ss-page-num" id="pageNum">1 / 1</span>
          <button class="ss-page-btn" id="nextBtn" type="button">التالي →</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/shell.js"></script>
  <script>
    const SS = {
      siteKey: null,
      page: 1,
      perPage: 25,
      filters: { dq: '', from: '', to: '', verdict: '' },
    };

    const esc = Shell.esc;
    const fmtNum = Shell.fmtNum;

    function setSubtitle() {
      const el = document.getElementById('ssSub');
      if (!el) return;
      el.textContent = SS.siteKey ? 'مرتبط بالموقع المحدد' : 'عرض وتحليل كل الـ sessions';
    }

    function buildQuery() {
      const p = new URLSearchParams();
      if (SS.siteKey) p.set('site', SS.siteKey);
      if (SS.filters.dq) p.set('data_quality', SS.filters.dq);
      if (SS.filters.from) p.set('from_date', SS.filters.from);
      if (SS.filters.to) p.set('to_date', SS.filters.to);
      p.set('page', SS.page);
      p.set('per_page', SS.perPage);
      return p;
    }

    async function loadCompare() {
      try {
        const d = await Shell.api('/api/sessions/compare/stats');
        const card = document.getElementById('compareCard');
        const badge = document.getElementById('compareBadge');
        const groups = document.getElementById('compareGroups');
        const diag = document.getElementById('compareDiagnostic');

        card.style.display = '';

        let badgeClass = 'info';
        let badgeLabel = 'معلومات';
        if (d.diagnostic === 'v3_only') { badgeClass = 'ready'; badgeLabel = '✓ v3 شغال'; }
        else if (d.diagnostic === 'v2_only') { badgeClass = 'warn'; badgeLabel = '⚠️ v2 فقط'; }
        else if (d.diagnostic === 'mixed') { badgeClass = 'info'; badgeLabel = '🔀 خليط'; }
        else if (d.diagnostic === 'no_data') { badgeClass = 'bad'; badgeLabel = 'لا بيانات'; }

        badge.innerHTML = `<span class="ss-compare-badge ${badgeClass}">${badgeLabel}</span>`;

        let groupsHtml = '';
        for (const g of (d.groups || [])) {
          const dq = g.data_quality || 'unknown';
          const cls = (dq === 'full' || dq === 'partial' || dq === 'legacy') ? dq : '';
          groupsHtml += `
            <div class="ss-group ${cls}">
              <div class="ss-group-label">${esc(dq)}</div>
              <div class="ss-group-val">${fmtNum(g.count)}</div>
              <div class="ss-group-sub">
                متوسط: ${esc(g.avg_time_human || '—')}
                <br>مدى: ${g.min_time_ms}–${g.max_time_ms}ms
              </div>
            </div>
          `;
        }
        groups.innerHTML = groupsHtml || '<div style="color:#7B8496;font-size:12px;text-align:center;padding:12px;">مفيش بيانات كافية للمقارنة</div>';

        if (d.v2_fixed_2000ms_ratio !== null && d.v2_fixed_2000ms_ratio !== undefined) {
          diag.innerHTML = `🔬 <b>${d.v2_fixed_2000ms_ratio}%</b> من زيارات legacy على 2000ms بالظبط — ${esc(d.recommendation)}`;
        } else {
          diag.textContent = d.recommendation || '—';
        }
        diag.className = 'ss-diagnostic ' + (d.diagnostic === 'v3_only' ? 'ready' : d.diagnostic === 'v2_only' ? 'warn' : d.diagnostic === 'mixed' ? '' : 'bad');
      } catch (e) {
        // silent
      }
    }

    function renderList(data) {
      const list = document.getElementById('listView');
      const empty = document.getElementById('emptyView');
      const loading = document.getElementById('loadingView');
      const pagination = document.getElementById('paginationView');

      loading.style.display = 'none';

      if (!data.items || data.items.length === 0) {
        list.style.display = 'none';
        empty.style.display = '';
        pagination.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      list.style.display = '';
      pagination.style.display = '';

      // فلتر الحكم يدوي (API ما بيرجعش verdict في list)
      let items = data.items;
      if (SS.filters.verdict) {
        items = items.filter(i => (i.verdict || '').toLowerCase() === SS.filters.verdict);
      }

      list.innerHTML = items.map(s => {
        const dq = s.data_quality || 'unknown';
        const verdict = (s.verdict || 'pending').toLowerCase();
        const verdictLabel = s.verdict ? s.verdict.toUpperCase() : 'PENDING';
        const time = s.started_at ? new Date(s.started_at).toLocaleString('en-GB', {
          month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit'
        }) : '—';

        return `
          <a href="/sessions/${esc(s.session_id)}" class="ss-item">
            <div class="ss-item-sid">#${esc(s.session_id.substring(0, 8))}</div>
            <div class="ss-item-meta">
              <span class="ss-meta-chip dq-${dq}">${esc(dq)}</span>
              <span class="ss-meta-chip verdict-${verdict}">${esc(verdictLabel)}</span>
              ${s.country_code ? `<span class="ss-meta-text">${esc(s.country_code)}</span>` : ''}
              ${s.browser ? `<span class="ss-meta-text">· ${esc(s.browser)}</span>` : ''}
              ${s.device ? `<span class="ss-meta-text">· ${esc(s.device)}</span>` : ''}
            </div>
            <div class="ss-item-time">${esc(time)}</div>
            <div class="ss-item-duration">${esc(s.duration_human || '—')}</div>
            <div class="ss-item-hb">
              <div class="ss-item-hb-count">${s.heartbeats}</div>
              <div class="ss-item-hb-label">beat</div>
            </div>
          </a>
        `;
      }).join('');

      // pagination
      const info = document.getElementById('pageInfo');
      const num = document.getElementById('pageNum');
      const prev = document.getElementById('prevBtn');
      const next = document.getElementById('nextBtn');
      const from = data.total > 0 ? (data.page - 1) * data.per_page + 1 : 0;
      const to = Math.min(data.page * data.per_page, data.total);
      info.innerHTML = `عرض <b style="color:#F8FAFC;">${fmtNum(from)}–${fmtNum(to)}</b> من <b style="color:#F8FAFC;">${fmtNum(data.total)}</b>`;
      num.textContent = `${data.page} / ${data.pages || 1}`;
      prev.disabled = data.page <= 1;
      next.disabled = data.page >= data.pages;
    }

    async function loadSessions() {
      document.getElementById('loadingView').style.display = '';
      document.getElementById('listView').style.display = 'none';
      document.getElementById('emptyView').style.display = 'none';
      document.getElementById('paginationView').style.display = 'none';

      try {
        const q = buildQuery();
        const data = await Shell.api('/api/sessions?' + q.toString());
        renderList(data);
      } catch (e) {
        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('emptyView').style.display = '';
        document.getElementById('emptyView').innerHTML = `
          <span class="ss-empty-icon">⚠️</span>
          <div class="ss-empty-title">فشل التحميل</div>
          <div style="font-size:12px;">${esc(e.message)}</div>
        `;
      }
    }

    function applyFilters() {
      SS.filters.dq = document.getElementById('fDq').value;
      SS.filters.from = document.getElementById('fFrom').value;
      SS.filters.to = document.getElementById('fTo').value;
      SS.filters.verdict = document.getElementById('fVerdict').value;
      SS.page = 1;
      loadSessions();
    }

    function clearFilters() {
      document.getElementById('fDq').value = '';
      document.getElementById('fFrom').value = '';
      document.getElementById('fTo').value = '';
      document.getElementById('fVerdict').value = '';
      applyFilters();
    }

    (async function boot() {
      try {
        const params = new URLSearchParams(location.search);
        SS.siteKey = params.get('site') || null;

        let currentSite = null;
        if (SS.siteKey) {
          try {
            const sites = await Shell.api('/api/sites');
            currentSite = sites.find(s => s.site_key === SS.siteKey) || null;
          } catch (e) {}
        }

        await Shell.mount({
          active: 'sessions',
          lang: 'ar',
          currentSite,
          breadcrumb: [
            { label: 'Sessions', href: '/sessions' },
            ...(currentSite ? [{ label: currentSite.name }] : []),
          ],
        });
        document.getElementById('bootSkeleton').style.display = 'none';
        document.getElementById('shAppRoot').style.display = '';

        setSubtitle();

        document.getElementById('applyBtn').addEventListener('click', applyFilters);
        document.getElementById('clearBtn').addEventListener('click', clearFilters);
        document.getElementById('refreshBtn').addEventListener('click', () => { loadCompare(); loadSessions(); });
        document.getElementById('prevBtn').addEventListener('click', () => { SS.page = Math.max(1, SS.page - 1); loadSessions(); });
        document.getElementById('nextBtn').addEventListener('click', () => { SS.page = SS.page + 1; loadSessions(); });

        // prefill from URL
        if (params.get('data_quality')) {
          document.getElementById('fDq').value = params.get('data_quality');
          SS.filters.dq = params.get('data_quality');
        }

        loadCompare();
        loadSessions();
      } catch (e) {
        console.error('[Sessions Boot]', e);
        const skel = document.getElementById('bootSkeleton');
        if (skel) {
          skel.innerHTML = `<div style="color:#F43F5E;font-weight:700;">فشل التحميل</div><div style="font-size:12px;margin-top:8px;">${esc(e.message || '')}</div>`;
        }
      }
    })();
  </script>
</body>
</html>
