<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/shell.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #08090D; }
    body { font-family: 'Inter', 'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif; color: #CBD5E1; -webkit-font-smoothing: antialiased; overflow: hidden; }
    #shAppRoot { height: 100vh; width: 100vw; overflow: hidden; background: #08090D; }
    .db-shell-skel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: #08090D; color: #7B8496; font-size: 13px; z-index: 9998; }
    .db-shell-skel .spinner { width: 32px; height: 32px; border: 3px solid #232734; border-top-color: #7C5CFF; border-radius: 50%; animation: db-spin 0.8s linear infinite; }
    @keyframes db-spin { to { transform: rotate(360deg); } }

    .db-hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 900px) { .db-hero { grid-template-columns: repeat(2, 1fr); } }
    .db-kpi { position: relative; background: #0F1117; border: 1px solid #232734; border-radius: 14px; padding: 16px; overflow: hidden; transition: border-color 120ms, transform 120ms; }
    .db-kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--kpi-color, #7C5CFF); opacity: 0.65; }
    .db-kpi:hover { border-color: #2E3446; transform: translateY(-1px); }
    .db-kpi-label { font-size: 10px; font-weight: 700; color: #4A5263; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .db-kpi-value { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800; color: #F8FAFC; line-height: 1.05; letter-spacing: -0.02em; }
    .db-kpi-delta { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; margin-top: 4px; letter-spacing: 0.02em; }
    .db-kpi-delta.up { color: #10B981; }
    .db-kpi-delta.down { color: #F43F5E; }
    .db-kpi-delta.flat { color: #4A5263; }

    .db-warning {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.35);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      color: #FCD34D;
      font-size: 12px;
      line-height: 1.5;
    }
    .db-warning.high { background: rgba(244,63,94,0.08); border-color: rgba(244,63,94,0.35); color: #FDA4AF; }
    .db-warning-icon { font-size: 20px; flex-shrink: 0; line-height: 1.4; }
    .db-warning-body { flex: 1; min-width: 0; }
    .db-warning-title { font-weight: 800; color: #F8FAFC; margin-bottom: 2px; font-size: 12px; }
    .db-warning-msg { font-size: 11.5px; }

    .db-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    @media (max-width: 900px) { .db-split { grid-template-columns: 1fr; } }

    .db-card { background: #0F1117; border: 1px solid #232734; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; }
    .db-card-title { font-size: 13px; font-weight: 800; color: #F8FAFC; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

    .db-camp-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #161822; border-radius: 8px; margin-bottom: 8px; text-decoration: none; color: inherit; transition: background 120ms; }
    .db-camp-row:hover { background: #1C1F2E; }
    .db-camp-name { font-size: 13px; font-weight: 700; color: #F8FAFC; margin-bottom: 2px; }
    .db-camp-meta { font-size: 10px; color: #7B8496; }
    .db-camp-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; }
    .db-camp-val.pos { color: #10B981; }
    .db-camp-val.neg { color: #F43F5E; }
    .db-camp-val.muted { color: #4A5263; }

    .db-empty { text-align: center; padding: 32px 16px; color: #7B8496; font-size: 12px; }
    .db-empty-icon { font-size: 32px; display: block; margin-bottom: 8px; opacity: 0.5; }
    .db-empty.good { color: #6EE7B7; }
    .db-empty.good .db-empty-icon { opacity: 1; }
  </style>
</head>
<body>

  <div class="db-shell-skel" id="bootSkeleton"><div class="spinner"></div><div>جاري التحميل…</div></div>

  <div id="shAppRoot" style="display:none;">
    <main id="shContent">
      <!-- Phase 1: warnings banner -->
      <div id="dashWarnings" class="db-warning" style="display:none;">
        <span class="db-warning-icon">⚠️</span>
        <div class="db-warning-body">
          <div class="db-warning-title" id="dashWarningsTitle">—</div>
          <div class="db-warning-msg" id="dashWarningsMsg">—</div>
        </div>
      </div>

      <div class="db-hero" id="heroKpis">
        <div class="db-kpi" style="--kpi-color: #7C5CFF;">
          <div class="db-kpi-label">إجمالي الزيارات (7 أيام)</div>
          <div class="db-kpi-value" id="kpiTotal">0</div>
        </div>
        <div class="db-kpi" style="--kpi-color: #10B981;">
          <div class="db-kpi-label">الزيارات الصالحة (7 أيام)</div>
          <div class="db-kpi-value" id="kpiValid" style="color:#10B981;">0</div>
        </div>
        <div class="db-kpi" style="--kpi-color: #F43F5E;">
          <div class="db-kpi-label">الزيارات المرفوضة (7 أيام)</div>
          <div class="db-kpi-value" id="kpiInvalid" style="color:#F43F5E;">0</div>
        </div>
        <div class="db-kpi" style="--kpi-color: #22D3EE;">
          <div class="db-kpi-label">إجمالي الربح (7 أيام)</div>
          <div class="db-kpi-value" id="kpiProfit" style="color:#22D3EE;">$0.00</div>
        </div>
      </div>

      <div class="db-split">
        <!-- Top Performing Campaigns -->
        <div class="db-card">
          <div class="db-card-title">🔥 أفضل الحملات (أعلى ربح)</div>
          <div id="topCampaigns"></div>
        </div>

        <!-- Worst Performing Campaigns -->
        <div class="db-card">
          <div class="db-card-title">🚨 حملات بتخسر (أقل ربح)</div>
          <div id="worstCampaigns"></div>
        </div>
      </div>

      <!-- Recent Campaigns Grid -->
      <div class="db-card">
        <div class="db-card-title">
          🎯 كل الحملات
          <a href="/campaigns" class="sh-btn sh-btn-ghost sh-btn-sm" style="text-decoration:none;">عرض الكل ←</a>
        </div>
        <div id="allCampaignsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px;"></div>
      </div>
    </main>
  </div>

  <script src="/static/js/shell.js"></script>
  <script>
    const DB = { campaigns: [], pulse: null };

    function fmtMoney(n) {
      const v = Number(n || 0);
      if (Math.abs(v) < 0.005) return '$0.00';
      const sign = v > 0 ? '+' : (v < 0 ? '-' : '');
      return sign + '$' + Math.abs(v).toFixed(2);
    }

    // Phase 1: render KPI with delta vs previous period
    function renderKPI(id, current, prev, formatter) {
      const el = document.getElementById(id);
      if (!el) return;
      const fmtVal = formatter || Shell.fmtNum;
      el.textContent = fmtVal(current);

      // Delta calculation
      let deltaText = '';
      let deltaClass = 'flat';
      if (prev != null && Math.abs(Number(prev)) > 0.001) {
        const pct = ((Number(current) - Number(prev)) / Math.abs(Number(prev))) * 100;
        if (pct > 0.5) {
          deltaClass = 'up';
          deltaText = `↑ ${pct.toFixed(0)}% vs الأسبوع السابق`;
        } else if (pct < -0.5) {
          deltaClass = 'down';
          deltaText = `↓ ${Math.abs(pct).toFixed(0)}% vs الأسبوع السابق`;
        } else {
          deltaClass = 'flat';
          deltaText = '→ ثابت';
        }
      } else if (Number(current) > 0.001) {
        deltaClass = 'up';
        deltaText = 'جديد هذا الأسبوع';
      } else {
        deltaClass = 'flat';
        deltaText = 'لا بيانات';
      }

      // Attach delta element
      const parent = el.parentElement;
      if (parent) {
        let deltaEl = parent.querySelector('.db-kpi-delta');
        if (!deltaEl) {
          deltaEl = document.createElement('div');
          deltaEl.className = 'db-kpi-delta';
          parent.appendChild(deltaEl);
        }
        deltaEl.className = `db-kpi-delta ${deltaClass}`;
        deltaEl.textContent = deltaText;
      }
    }

    // Phase 1: render top warning banner (integrity issues)
    function renderWarnings(pulse) {
      const banner = document.getElementById('dashWarnings');
      const title = document.getElementById('dashWarningsTitle');
      const msg = document.getElementById('dashWarningsMsg');
      if (!banner) return;

      const week = pulse.week || {};
      const integrity = week.integrity || {};
      const source = week.source || 'unknown';

      let showWarning = false;
      let severity = 'medium';
      let titleText = '';
      let msgText = '';

      if (source === 'cpm') {
        showWarning = true;
        severity = 'medium';
        titleText = 'الربح تقديري (بناءً على CPM)';
        msgText = 'مفيش BID من PopAds في بعض الزيارات — الربح محسوب تقديرياً. اضبط CPM في الإعدادات لدقة أعلى.';
      } else if (integrity.integrity === 'partial_warn') {
        showWarning = true;
        severity = 'high';
        titleText = 'تحذير: تغطية BID منخفضة';
        msgText = `فقط ${integrity.bid_coverage_pct}% من الزيارات فيها BID. التكلفة والربح مُقللين بشكل ملحوظ. راجع الـ tracking macros.`;
      } else if (integrity.integrity === 'partial') {
        showWarning = true;
        severity = 'medium';
        titleText = 'تغطية BID جزئية';
        msgText = `${integrity.visits_without_bid} زيارة بدون BID — التكلفة محسوبة على ${integrity.bid_coverage_pct}% فقط.`;
      }

      if (!showWarning) {
        banner.style.display = 'none';
        return;
      }

      banner.className = 'db-warning' + (severity === 'high' ? ' high' : '');
      title.textContent = titleText;
      msg.textContent = msgText;
      banner.style.display = 'flex';
    }

    async function loadDashboard() {
      try {
        // Phase 1: pulse endpoint (1 call instead of many)
        const [pulse, campaigns] = await Promise.all([
          Shell.api('/api/stats/pulse'),
          Shell.api('/api/campaigns'),
        ]);
        DB.pulse = pulse;
        DB.campaigns = campaigns || [];

        // KPIs from pulse (week vs week_prev)
        const week = pulse.week || {};
        const weekPrev = pulse.week_prev || {};

        renderKPI('kpiTotal', week.visits || 0, weekPrev.visits || 0);
        renderKPI('kpiValid', week.valid || 0, weekPrev.valid || 0);
        renderKPI('kpiInvalid', week.invalid || 0, weekPrev.invalid || 0);
        renderKPI('kpiProfit', week.profit || 0, weekPrev.profit || 0, fmtMoney);

        // Profit color based on sign
        const profEl = document.getElementById('kpiProfit');
        if (profEl) {
          profEl.style.color = (week.profit || 0) >= 0 ? '#22D3EE' : '#F43F5E';
        }

        // Warnings
        renderWarnings(pulse);

        // Campaigns: sort by profit
        const sorted = [...DB.campaigns].sort((a, b) => {
          const pA = (a.stats?.pl?.profit) || 0;
          const pB = (b.stats?.pl?.profit) || 0;
          return pB - pA;
        });

        // Phase 1 fix: proper filtering (no more overlap between top and worst)
        const profitable = sorted.filter(c => ((c.stats?.pl?.profit) || 0) > 0.01);
        const losing = [...sorted].reverse().filter(c => ((c.stats?.pl?.profit) || 0) < -0.01);

        const top = profitable.slice(0, 3);
        const worst = losing.slice(0, 3);

        // Render top with proper empty state
        if (top.length === 0) {
          document.getElementById('topCampaigns').innerHTML = `
            <div class="db-empty">
              <span class="db-empty-icon">📊</span>
              مفيش حملات رابحة في الفترة دي
            </div>`;
        } else {
          renderCampaignList('topCampaigns', top);
        }

        // Render worst with proper empty state
        if (worst.length === 0) {
          document.getElementById('worstCampaigns').innerHTML = `
            <div class="db-empty good">
              <span class="db-empty-icon">✅</span>
              مفيش حملات خسرانة — ممتاز!
            </div>`;
        } else {
          renderCampaignList('worstCampaigns', worst);
        }

        // All campaigns grid
        renderCampaignsGrid(DB.campaigns);

      } catch (e) {
        console.error(e);
        Shell.toast('فشل تحميل البيانات: ' + e.message, 'error');
      }
    }

    function renderCampaignList(containerId, campaigns) {
      const el = document.getElementById(containerId);
      if (!el) return;
      if (!campaigns.length) {
        el.innerHTML = `<div class="db-empty"><span class="db-empty-icon">📭</span>لا توجد بيانات</div>`;
        return;
      }
      el.innerHTML = campaigns.map(c => {
        const st = c.stats || {};
        const pl = st.pl || {};
        const profit = pl.profit || 0;
        const isMuted = pl.error === 'no_sell_revenue';
        const cls = isMuted ? 'muted' : (profit >= 0 ? 'pos' : 'neg');
        const display = isMuted ? '—' : fmtMoney(profit);
        return `
          <a href="/campaigns/${c.id}" class="db-camp-row">
            <div>
              <div class="db-camp-name">${Shell.esc(c.name)}</div>
              <div class="db-camp-meta">${Shell.esc(c.traffic_source_slug)} → ${Shell.esc(c.destination_slug)}</div>
            </div>
            <div class="db-camp-val ${cls}">${display}</div>
          </a>`;
      }).join('');
    }

    function renderCampaignsGrid(campaigns) {
      const grid = document.getElementById('allCampaignsGrid');
      if (!campaigns.length) {
        grid.innerHTML = `<div class="db-empty" style="grid-column:1/-1;"><span class="db-empty-icon">🎯</span>مفيش حملات لسه. ابدأ بإضافة حملة جديدة.</div>`;
        return;
      }
      grid.innerHTML = campaigns.slice(0, 6).map(c => {
        const st = c.stats || {};
        const pl = st.pl || {};
        const profit = pl.profit || 0;
        const isMuted = pl.error === 'no_sell_revenue';
        const cls = isMuted ? 'muted' : (profit >= 0 ? 'pos' : 'neg');
        const badge = c.status === 'active' ? '🟢 نشطة' : c.status === 'paused' ? '⏸ موقوفة' : '📦 مؤرشفة';
        const display = isMuted ? '—' : fmtMoney(profit);
        return `
          <a href="/campaigns/${c.id}" class="db-camp-row" style="flex-direction:column;align-items:flex-start;">
            <div style="width:100%;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
              <div>
                <div class="db-camp-name">${Shell.esc(c.name)}</div>
                <div class="db-camp-meta">${badge} · ${Shell.esc(c.type)}</div>
              </div>
              <div class="db-camp-val ${cls}">${display}</div>
            </div>
            <div style="width:100%;display:flex;justify-content:space-between;font-size:10px;color:#4A5263;border-top:1px solid #1A1D29;padding-top:8px;">
              <span>إجمالي: ${Shell.fmtNum(st.total || 0)}</span>
              <span style="color:#F43F5E;">بوت: ${Number(st.bot_rate || 0).toFixed(0)}%</span>
            </div>
          </a>`;
      }).join('');
    }

    (async function boot() {
      try {
        await Shell.mount({ active: 'dashboard', lang: 'ar', breadcrumb: [{ label: 'لوحة التحكم' }] });
        document.getElementById('bootSkeleton').style.display = 'none';
        document.getElementById('shAppRoot').style.display = '';
        await loadDashboard();
      } catch (e) {
        document.getElementById('bootSkeleton').innerHTML = `<div style="color:#F43F5E;">فشل التحميل: ${Shell.esc(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
