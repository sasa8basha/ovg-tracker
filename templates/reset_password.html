<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · إعادة تعيين كلمة المرور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Cairo',sans-serif;background:#0F172A;color:#F1F5F9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .card{background:#1E293B;border:1px solid #334155;border-radius:24px;padding:32px;width:100%;max-width:440px}
    .input{width:100%;padding:12px 16px;border:1.5px solid #334155;border-radius:12px;font-size:15px;background:#0F172A;color:#F1F5F9;margin-top:6px;box-sizing:border-box;font-family:'Cairo',sans-serif}
    .input:focus{outline:none;border-color:#6366F1;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
    .btn{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;padding:13px;border-radius:12px;font-weight:700;width:100%;border:none;cursor:pointer;font-size:15px;font-family:'Cairo',sans-serif;margin-top:6px}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    label{font-size:13px;color:#CBD5E1;font-weight:600}
    .success{background:rgba(16,185,129,.1);color:#10B981;padding:12px;border-radius:10px;font-size:13px;border:1px solid rgba(16,185,129,.3);text-align:center}
    .error{background:rgba(244,63,94,.1);color:#F43F5E;padding:12px;border-radius:10px;font-size:13px;border:1px solid rgba(244,63,94,.2);text-align:center}
    .hint{color:#94A3B8;font-size:11px;margin-top:4px}
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#10B981,#059669);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:36px">🔑</div>
      <h1 style="font-size:22px;font-weight:800;margin:0">كلمة مرور جديدة</h1>
      <p style="color:#94A3B8;font-size:13px;margin:8px 0 0">اختار كلمة مرور قوية لحسابك.</p>
    </div>

    <form id="resetForm" style="display:flex;flex-direction:column;gap:14px">
      <div>
        <label>كلمة المرور الجديدة</label>
        <input name="new_password" type="password" class="input" placeholder="••••••••" required minlength="8">
        <p class="hint">8 حروف على الأقل، وتحتوي على حرفين مختلفين (كبير/صغير/رقم/رمز)</p>
      </div>
      <div>
        <label>تأكيد كلمة المرور</label>
        <input name="confirm" type="password" class="input" placeholder="••••••••" required>
      </div>
      <p id="msg" style="display:none"></p>
      <button type="submit" id="submitBtn" class="btn">تحديث كلمة المرور</button>
      <a href="/" style="text-align:center;color:#818CF8;font-size:13px;text-decoration:none">← رجوع لتسجيل الدخول</a>
    </form>
  </div>

  <script>
    const token = new URL(location.href).searchParams.get('token') || '';
    const msg = document.getElementById('msg');
    
    if (!token) {
      msg.className = 'error';
      msg.textContent = 'رابط غير صالح. اطلب رابط جديد من صفحة "نسيت كلمة المرور".';
      msg.style.display = 'block';
      document.getElementById('submitBtn').disabled = true;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; msg.style.display = 'none';
      const orig = btn.textContent; btn.textContent = 'جاري...';
      const fd = new FormData(e.target);
      const pw = fd.get('new_password');
      if (pw !== fd.get('confirm')) {
        msg.className = 'error'; msg.textContent = 'كلمتا المرور غير متطابقتين';
        msg.style.display = 'block';
        btn.disabled = false; btn.textContent = orig; return;
      }
      try {
        const r = await fetch('/api/auth/reset-password', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ token, new_password: pw })
        });
        const d = await r.json().catch(()=>({}));
        if (r.ok) {
          msg.className = 'success'; msg.textContent = d.message || 'تم إعادة التعيين';
          msg.style.display = 'block';
          setTimeout(() => location.href = '/dashboard', 1500);
        } else {
          msg.className = 'error'; msg.textContent = d.detail || 'فشل العملية';
          msg.style.display = 'block';
        }
      } catch(err) {
        msg.className = 'error'; msg.textContent = 'خطأ في الاتصال';
        msg.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    });
  </script>
</body>
  </html>
