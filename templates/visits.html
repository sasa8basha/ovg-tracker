<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · كل الزيارات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    body{font-family:'Cairo',sans-serif;background:var(--bg-page);color:var(--text-primary)}
    .table-row { border-right: 4px solid transparent; transition: all 0.2s; }
    .table-row:hover { background: rgba(255,255,255,0.03) !important; transform: scale(1.002); }
    .row-clean, .row-valid { border-right-color: var(--valid); }
    .row-invalid, .row-high_risk { border-right-color: var(--invalid); }
    .row-suspicious { border-right-color: var(--suspicious); }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-white">سجل الزيارات</h1>
        <p class="text-slate-400 text-sm mt-1">تحليل دقيق لكل زيارة لتحسين الأربتراج والـ CPM</p>
      </div>
      <div class="flex gap-3">
        <button id="exportBtn" onclick="exportData()" class="btn-primary flex items-center gap-2">
          <span>📥 تصدير CSV</span>
        </button>
        <button onclick="window.location.href='/dashboard'" class="btn-ghost border border-slate-600">← العودة للداشبورد</button>
      </div>
    </div>

    <div class="glass rounded-2xl p-4 mb-6 flex gap-4 flex-wrap">
      <select id="filterVerdict" class="bg-black/20 border border-white/10 text-white rounded-xl px-4 py-2 outline-none text-sm" onchange="loadVisits(1)">
        <option value="">كل الأحكام</option>
        <option value="clean">نظيف (Clean)</option>
        <option value="valid">سليم (Valid)</option>
        <option value="suspicious">مشبوه (Suspicious)</option>
        <option value="high_risk">خطر عالي (High Risk)</option>
        <option value="invalid">بوت (Invalid)</option>
      </select>
      <div class="flex-1"></div>
      <div class="text-slate-400 text-sm flex items-center">إجمالي الزيارات: <span id="totalCount" class="text-white font-bold mr-2">0</span></div>
    </div>

    <div class="glass rounded-2xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-right">
          <thead class="bg-black/40 text-slate-400 text-xs uppercase font-bold">
            <tr>
              <th class="px-4 py-4">رقم الزيارة</th>
              <th class="px-4 py-4">الوقت</th>
              <th class="px-4 py-4">IP / الدولة</th>
              <th class="px-4 py-4 text-center">مدة المكوث</th>
              <th class="px-4 py-4 text-center">تفاعل (نقرات/سكرول)</th>
              <th class="px-4 py-4 text-center">Score</th>
              <th class="px-4 py-4 text-center">الثقة</th>
              <th class="px-4 py-4 text-center">الحكم</th>
              <th class="px-4 py-4"></th>
            </tr>
          </thead>
          <tbody id="visitsTable" class="divide-y divide-white/5"></tbody>
        </table>
      </div>
    </div>
    
    <div class="flex justify-between items-center mt-6">
      <button id="prevBtn" onclick="loadVisits(currentPage - 1)" class="btn-ghost border border-slate-700 text-sm disabled:opacity-30">الصفحة السابقة</button>
      <span id="pageInfo" class="text-slate-400 text-sm">صفحة 1</span>
      <button id="nextBtn" onclick="loadVisits(currentPage + 1)" class="btn-ghost border border-slate-700 text-sm disabled:opacity-30">الصفحة التالية</button>
    </div>
  </div>

  <script>
    const siteKey = new URL(location.href).searchParams.get('site');
    let currentPage = 1;

    function exportData() {
      let url = `/api/export/visits`;
      if (siteKey) url += `?site=${siteKey}`;
      window.location.href = url;
    }

    async function loadVisits(page) {
      if (page < 1) return;
      const verdict = document.getElementById('filterVerdict').value;
      let url = `/api/visits?page=${page}&per_page=20`;
      if (siteKey) url += `&site=${siteKey}`;
      if (verdict) url += `&verdict=${verdict}`;

      const r = await fetch(url);
      if (!r.ok) return;
      const d = await r.json();
      
      currentPage = d.page;
      document.getElementById('totalCount').textContent = d.total;
      document.getElementById('pageInfo').textContent = `صفحة ${d.page} من ${d.pages || 1}`;
      document.getElementById('prevBtn').disabled = d.page <= 1;
      document.getElementById('nextBtn').disabled = d.page >= d.pages;

      const tb = document.getElementById('visitsTable');
      if (!d.items.length) {
        tb.innerHTML = `<tr><td colspan="9" class="text-center py-10 text-slate-500">لا توجد زيارات مطابقة</td></tr>`;
        return;
      }

      tb.innerHTML = d.items.map(v => {
        let badgeClass = '', rowClass = '', scoreColor = '';
        
        if (v.verdict === 'clean' || v.verdict === 'valid') {
           badgeClass = 'bg-emerald-500/10 text-emerald-400'; rowClass = 'row-clean'; scoreColor = 'text-emerald-400';
        } else if (v.verdict === 'invalid' || v.verdict === 'high_risk') {
           badgeClass = 'bg-rose-500/10 text-rose-400'; rowClass = 'row-invalid'; scoreColor = 'text-rose-400';
        } else {
           badgeClass = 'bg-amber-500/10 text-amber-400'; rowClass = 'row-suspicious'; scoreColor = 'text-amber-400';
        }
        
        return `<tr class="table-row ${rowClass} cursor-pointer hover:bg-white/5" onclick="window.location.href='/visits/${v.id}'">
          <td class="px-4 py-4 font-mono text-indigo-300 text-xs">#${v.id}</td>
          <td class="px-4 py-4 text-slate-400 text-xs font-mono">${v.time}</td>
          <td class="px-4 py-4 text-xs">
            <div class="font-bold text-white">${v.ip}</div>
            <div class="text-slate-500">${v.country} · ${v.browser}</div>
          </td>
          <td class="px-4 py-4 text-center">
            <span class="bg-blue-500/10 text-blue-400 px-2 py-1 rounded font-mono text-xs">${v.time_on_page}s</span>
          </td>
          <td class="px-4 py-4 text-center text-xs">
            <span class="text-slate-300">🖱️ ${v.clicks}</span> | <span class="text-slate-300">📜 ${v.scrolls}</span>
          </td>
          <td class="px-4 py-4 text-center font-bold font-mono ${scoreColor}">${v.score}</td>
          <td class="px-4 py-4 text-center font-mono text-xs text-indigo-300">${v.confidence}%</td>
          <td class="px-4 py-4 text-center"><span class="${badgeClass} px-2.5 py-1 rounded-md text-[10px] font-bold border border-white/5">${v.verdict.toUpperCase()}</span></td>
          <td class="px-4 py-4 text-center text-indigo-400">←</td>
        </tr>`;
      }).join('');
    }

    loadVisits(1);
  </script>
</body>
</html>
