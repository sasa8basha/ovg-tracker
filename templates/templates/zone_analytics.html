<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · Zone Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    body{font-family:'Cairo',sans-serif;background:var(--bg-page);color:var(--text-primary)}
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 1rem; }
    .sev-critical { background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.4); color: #fda4af; }
    .sev-high { background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.4); color: #fdba74; }
    .sev-medium { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.4); color: #fcd34d; }
    .sev-drop { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.4); color: #93c5fd; }
    .trend-rising { color: #f43f5e; }
    .trend-falling { color: #10b981; }
    .trend-stable { color: #94a3b8; }
    .sparkline { width: 120px; height: 30px; }
    table { color: var(--text-primary); }
    thead { background: rgba(0,0,0,0.4) !important; color: var(--text-secondary); }
    tbody tr:hover { background: rgba(255,255,255,0.03); cursor: pointer; }
    .modal-bg { background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-[1500px] mx-auto">

    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-3xl font-extrabold text-white">🚨 Zone Analytics</h1>
        <p class="text-slate-400 text-sm mt-1">تتبع اتجاه كل زون وكشف الـ anomalies في آخر 24 ساعة</p>
      </div>
      <div class="flex gap-2">
        <select id="daysSelect" onchange="loadAnalytics()" class="bg-black/30 border border-white/10 text-white text-sm rounded-lg px-3 py-2">
          <option value="7">آخر 7 أيام</option>
          <option value="14" selected>آخر 14 يوم</option>
          <option value="30">آخر 30 يوم</option>
        </select>
        <button onclick="window.location.href='/dashboard'" class="btn-ghost border border-slate-600">← العودة</button>
      </div>
    </div>

    <!-- Anomalies alert banner -->
    <div id="anomaliesBanner" class="hidden mb-6"></div>

    <!-- Zones table -->
    <div class="glass overflow-hidden">
      <div class="p-4 border-b border-white/5 flex justify-between items-center">
        <h2 class="text-sm font-bold text-white">📊 الزونات (مرتبة بالخطورة)</h2>
        <span class="text-xs text-slate-500" id="zoneCount">0</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-right">
          <thead class="text-[11px] uppercase font-bold">
            <tr>
              <th class="px-3 py-3">الزون</th>
              <th class="px-3 py-3 text-center">Sparkline</th>
              <th class="px-3 py-3 text-center">Bot Rate</th>
              <th class="px-3 py-3 text-center">Baseline</th>
              <th class="px-3 py-3 text-center">آخر ساعة</th>
              <th class="px-3 py-3 text-center">Z-score</th>
              <th class="px-3 py-3 text-center">الاتجاه</th>
              <th class="px-3 py-3 text-center">الحالة</th>
            </tr>
          </thead>
          <tbody id="zonesBody" class="divide-y divide-white/5"></tbody>
        </table>
      </div>
      <div id="zonesEmpty" class="hidden p-10 text-center text-slate-500 text-sm">
        مفيش زونات فيها 20 زيارة أو أكتر. محتاج بيانات أكتر لبدء التحليل.
      </div>
    </div>

  </div>

  <!-- Modal for zone details -->
  <div id="zoneModal" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-white/10 rounded-3xl p-6 w-full max-w-4xl shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-extrabold text-white">📈 <span id="modalZoneName">—</span></h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-2xl">×</button>
      </div>
      <div id="modalStats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4"></div>
      <div class="h-80"><canvas id="modalChart"></canvas></div>
    </div>
  </div>

  <script>
    const siteKey = new URL(location.href).searchParams.get('site');
    let analyticsData = null;
    let modalChartObj = null;

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function loadAnalytics() {
      const days = document.getElementById('daysSelect').value;
      const url = new URL('/api/zones/analytics', location.origin);
      if (siteKey) url.searchParams.set('site', siteKey);
      url.searchParams.set('days', days);

      try {
        const r = await fetch(url);
        if (!r.ok) return;
        analyticsData = await r.json();
        renderBanner(analyticsData.anomalies);
        renderZones(analyticsData.zones);
      } catch (e) { console.error(e); }
    }

    function renderBanner(anomalies) {
      const banner = document.getElementById('anomaliesBanner');
      if (!anomalies || !anomalies.length) {
        banner.classList.add('hidden');
        return;
      }
      const criticals = anomalies.filter(a => a.anomaly.severity === 'critical');
      const highs = anomalies.filter(a => a.anomaly.severity === 'high');
      const meds = anomalies.filter(a => a.anomaly.severity === 'medium');

      let cls = 'sev-medium';
      let icon = '⚠️';
      let title = `${anomalies.length} anomaly(s) detected`;
      if (criticals.length) { cls = 'sev-critical'; icon = '🚨'; title = `${criticals.length} critical anomaly(s)`; }
      else if (highs.length) { cls = 'sev-high'; icon = '⚠️'; title = `${highs.length} high anomaly(s)`; }

      banner.className = `mb-6 p-4 rounded-2xl ${cls}`;
      banner.innerHTML = `
        <div class="flex items-start gap-3">
          <span class="text-2xl">${icon}</span>
          <div class="flex-1">
            <div class="font-bold mb-2">${title} في آخر 24 ساعة</div>
            <div class="flex flex-wrap gap-2">
              ${anomalies.slice(0, 6).map(a => `
                <span class="px-2 py-1 rounded text-xs font-mono bg-black/30">
                  ${esc(a.zone)}: ${a.baseline_mean.toFixed(1)}% → ${a.current_rate.toFixed(1)}% (z=${a.anomaly.z_score})
                </span>
              `).join('')}
            </div>
          </div>
        </div>`;
      banner.classList.remove('hidden');
    }

    function renderSparkline(series) {
      if (!series || series.length < 2) return '<span class="text-slate-500 text-xs">—</span>';
      const values = series.map(s => s.bot_rate);
      const max = Math.max(...values, 10);
      const min = 0;
      const points = values.map((v, i) => {
        const x = (i / (values.length - 1)) * 100;
        const y = 30 - ((v - min) / (max - min)) * 28;
        return `${x},${y}`;
      }).join(' ');
      const last = values[values.length - 1];
      const color = last > 30 ? '#f43f5e' : last > 15 ? '#f59e0b' : '#10b981';
      return `<svg class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
        <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" />
      </svg>`;
    }

    function renderZones(zones) {
      const tb = document.getElementById('zonesBody');
      const empty = document.getElementById('zonesEmpty');
      document.getElementById('zoneCount').textContent = zones.length + ' زون';

      if (!zones.length) {
        tb.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      tb.innerHTML = zones.map(z => {
        const lastRate = z.series.length ? z.series[z.series.length - 1].bot_rate : 0;
        const botColor = lastRate > 30 ? 'text-rose-400' : lastRate > 15 ? 'text-amber-400' : 'text-emerald-400';

        let baselineText = '—';
        if (z.baseline) {
          baselineText = `${z.baseline.mean.toFixed(1)}% ± ${z.baseline.std.toFixed(1)}`;
        } else {
          baselineText = '<span class="text-amber-400 text-[10px]">عينة ناقصة</span>';
        }

        let currentText = '—';
        if (z.current) {
          currentText = `${z.current.bot_rate.toFixed(1)}% (${z.current.total})`;
        } else {
          currentText = '<span class="text-slate-500 text-[10px]">&lt;20 زيارة</span>';
        }

        let zScoreText = '—';
        let zScoreCls = 'text-slate-500';
        if (z.anomaly) {
          zScoreText = z.anomaly.z_score > 0 ? `+${z.anomaly.z_score}` : `${z.anomaly.z_score}`;
          zScoreCls = Math.abs(z.anomaly.z_score) >= 3 ? 'text-rose-400 font-bold'
                     : Math.abs(z.anomaly.z_score) >= 2.5 ? 'text-orange-400 font-bold'
                     : Math.abs(z.anomaly.z_score) >= 2 ? 'text-amber-400' : 'text-slate-400';
        }

        const trendArrow = z.trend.direction === 'rising' ? '↑'
                          : z.trend.direction === 'falling' ? '↓'
                          : z.trend.direction === 'stable' ? '→' : '?';
        const trendCls = 'trend-' + (z.trend.direction === 'rising' ? 'rising'
                                    : z.trend.direction === 'falling' ? 'falling' : 'stable');

        let statusBadge = '<span class="text-[10px] text-slate-500">—</span>';
        if (z.anomaly && z.anomaly.severity) {
          const sev = z.anomaly.severity;
          const map = {
            critical: ['sev-critical', '🚨 حرج'],
            high: ['sev-high', '⚠️ عالي'],
            medium: ['sev-medium', '⚡ متوسط'],
            critical_drop: ['sev-drop', '🔵 هبوط حرج'],
            high_drop: ['sev-drop', '🔵 هبوط عالي'],
            medium_drop: ['sev-drop', '🔵 هبوط'],
          };
          const [cls, label] = map[sev] || ['', sev];
          statusBadge = `<span class="px-2 py-1 rounded text-[10px] font-bold ${cls}">${label}</span>`;
        } else if (z.insufficient_data) {
          statusBadge = '<span class="text-[10px] text-amber-400">عينة ناقصة</span>';
        } else {
          statusBadge = '<span class="text-[10px] text-emerald-400">✓ طبيعي</span>';
        }

        return `<tr onclick="openZoneModal('${esc(z.zone)}')">
          <td class="px-3 py-3 font-mono text-xs text-white font-bold">${esc(z.zone)}</td>
          <td class="px-3 py-3 text-center">${renderSparkline(z.series)}</td>
          <td class="px-3 py-3 text-center font-mono font-bold ${botColor}">${lastRate.toFixed(1)}%</td>
          <td class="px-3 py-3 text-center font-mono text-xs text-slate-400">${baselineText}</td>
          <td class="px-3 py-3 text-center font-mono text-xs text-slate-300">${currentText}</td>
          <td class="px-3 py-3 text-center font-mono text-xs ${zScoreCls}">${zScoreText}</td>
          <td class="px-3 py-3 text-center text-lg ${trendCls}">${trendArrow}</td>
          <td class="px-3 py-3 text-center">${statusBadge}</td>
        </tr>`;
      }).join('');
    }

    function openZoneModal(zoneName) {
      if (!analyticsData) return;
      const z = analyticsData.zones.find(x => x.zone === zoneName);
      if (!z) return;

      document.getElementById('modalZoneName').textContent = zoneName;

      const statsEl = document.getElementById('modalStats');
      const current = z.current ? `${z.current.bot_rate.toFixed(1)}%` : '—';
      const baseline = z.baseline ? `${z.baseline.mean.toFixed(1)}%` : '—';
      const zscore = z.anomaly ? (z.anomaly.z_score > 0 ? '+' : '') + z.anomaly.z_score : '—';
      const trend = z.trend.direction;

      statsEl.innerHTML = `
        <div class="bg-black/30 rounded-lg p-3 text-center">
          <div class="text-[10px] text-slate-500 mb-1">Baseline</div>
          <div class="text-lg font-mono text-white">${baseline}</div>
        </div>
        <div class="bg-black/30 rounded-lg p-3 text-center">
          <div class="text-[10px] text-slate-500 mb-1">آخر ساعة</div>
          <div class="text-lg font-mono text-white">${current}</div>
        </div>
        <div class="bg-black/30 rounded-lg p-3 text-center">
          <div class="text-[10px] text-slate-500 mb-1">Z-score</div>
          <div class="text-lg font-mono text-white">${zscore}</div>
        </div>
        <div class="bg-black/30 rounded-lg p-3 text-center">
          <div class="text-[10px] text-slate-500 mb-1">الاتجاه</div>
          <div class="text-lg font-mono text-white">${trend}</div>
        </div>`;

      const labels = z.series.map(s => s.day);
      const botRates = z.series.map(s => s.bot_rate);
      const baselineLine = z.baseline ? z.series.map(() => z.baseline.mean) : [];
      const upperLine = z.baseline ? z.series.map(() => z.baseline.mean + 2 * z.baseline.std) : [];
      const lowerLine = z.baseline ? z.series.map(() => Math.max(0, z.baseline.mean - 2 * z.baseline.std)) : [];

      if (modalChartObj) modalChartObj.destroy();
      modalChartObj = new Chart(document.getElementById('modalChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Bot Rate %', data: botRates, borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.15)', fill: true, tension: 0.3, pointRadius: 3 },
            ...(z.baseline ? [
              { label: 'Baseline', data: baselineLine, borderColor: '#94a3b8', borderDash: [5, 5], fill: false, pointRadius: 0 },
              { label: '+2σ', data: upperLine, borderColor: '#f59e0b', borderDash: [2, 2], fill: false, pointRadius: 0, borderWidth: 1 },
              { label: '-2σ', data: lowerLine, borderColor: '#10b981', borderDash: [2, 2], fill: false, pointRadius: 0, borderWidth: 1 },
            ] : []),
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#cbd5e1', font: { family: 'Cairo' } } } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y: { min: 0, ticks: { color: '#94a3b8', callback: v => v + '%' }, grid: { color: 'rgba(255,255,255,0.05)' } },
          },
        },
      });

      document.getElementById('zoneModal').classList.remove('hidden');
      document.getElementById('zoneModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('zoneModal').classList.add('hidden');
      document.getElementById('zoneModal').classList.remove('flex');
    }
    document.getElementById('zoneModal').addEventListener('click', (e) => {
      if (e.target.id === 'zoneModal') closeModal();
    });

    loadAnalytics();
    setInterval(loadAnalytics, 60000);
  </script>
</body>
  </html>
