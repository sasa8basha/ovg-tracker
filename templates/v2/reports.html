<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · الخريطة والتقارير</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/neo/tokens.css">
  <link rel="stylesheet" href="/static/css/neo/utilities.css">
  <link rel="stylesheet" href="/static/css/neo/components.css">
  <link rel="stylesheet" href="/static/css/neo/shell.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: var(--neo-bg-canvas); }
    #neoAppRoot { height: 100vh; width: 100vw; overflow: hidden; background: var(--neo-bg-canvas); }

    .rp-shell-skel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: var(--neo-bg-canvas); color: var(--neo-fg-tertiary); font-size: 13px; z-index: 9998; }
    .rp-shell-skel .spinner { width: 32px; height: 32px; border: 3px solid var(--neo-border-default); border-top-color: var(--neo-accent); border-radius: 50%; animation: rp-spin 0.8s linear infinite; }
    @keyframes rp-spin { to { transform: rotate(360deg); } }

    .rp-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--neo-sp-4); margin-bottom: var(--neo-sp-4); flex-wrap: wrap; }
    .rp-header-title { font-size: var(--neo-fs-3xl); font-weight: var(--neo-fw-black); color: var(--neo-fg-primary); letter-spacing: -0.02em; margin: 0 0 4px 0; line-height: 1.1; }
    .rp-header-sub { font-size: var(--neo-fs-sm); color: var(--neo-fg-tertiary); }

    .rp-filters { background: var(--neo-bg-surface); border: 1px solid var(--neo-border-default); border-radius: var(--neo-r-md); padding: var(--neo-sp-3); margin-bottom: var(--neo-sp-3); display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--neo-sp-2); align-items: end; }
    @media (max-width: 700px) { .rp-filters { grid-template-columns: 1fr; } }
    .rp-filter-field { display: flex; flex-direction: column; gap: 4px; }
    .rp-filter-label { font-size: var(--neo-fs-2xs); font-weight: var(--neo-fw-bold); color: var(--neo-fg-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .rp-tabs { display: flex; gap: 4px; margin-bottom: var(--neo-sp-4); border-bottom: 1px solid var(--neo-border-default); flex-wrap: wrap; }
    .rp-tab { padding: var(--neo-sp-2) var(--neo-sp-4); background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--neo-fg-tertiary); font-family: inherit; font-size: var(--neo-fs-sm); font-weight: var(--neo-fw-extrabold); cursor: pointer; transition: all var(--neo-dur-fast); }
    .rp-tab:hover { color: var(--neo-fg-secondary); }
    .rp-tab.active { color: var(--neo-fg-primary); border-bottom-color: var(--neo-accent); }
    .rp-panel { display: none; }
    .rp-panel.active { display: block; }

    #rpMap { height: 550px; width: 100%; border-radius: var(--neo-r-md); z-index: 1; background: var(--neo-bg-canvas); border: 1px solid var(--neo-border-default); }
    .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
    .leaflet-container { background: var(--neo-bg-canvas) !important; }
    .marker-cluster-small { background-color: rgba(16,185,129,0.6); }
    .marker-cluster-small div { background-color: rgba(16,185,129,0.9); color: white; font-weight: 700; }
    .marker-cluster-medium { background-color: rgba(245,158,11,0.6); }
    .marker-cluster-medium div { background-color: rgba(245,158,11,0.9); color: white; font-weight: 700; }
    .marker-cluster-large { background-color: rgba(239,68,68,0.6); }
    .marker-cluster-large div { background-color: rgba(239,68,68,0.9); color: white; font-weight: 700; }

    .rp-map-stats { padding: var(--neo-sp-2); text-align: center; font-size: var(--neo-fs-xs); color: var(--neo-fg-tertiary); }

    .rp-card { background: var(--neo-bg-surface); border: 1px solid var(--neo-border-default); border-radius: var(--neo-r-md); padding: var(--neo-sp-4); }
    .rp-card-title { font-size: var(--neo-fs-sm); font-weight: var(--neo-fw-extrabold); color: var(--neo-fg-primary); margin: 0 0 var(--neo-sp-3) 0; }
    .rp-chart-wrap { height: 300px; position: relative; }

    .rp-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--neo-sp-3); }
    @media (max-width: 900px) { .rp-grid-2 { grid-template-columns: 1fr; } }

    .rp-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--neo-r-xs);
      font-size: 9px;
      font-weight: var(--neo-fw-extrabold);
      font-family: var(--neo-font-mono);
      text-transform: uppercase;
    }
    .rp-badge.A { background: var(--neo-success-bg); color: var(--neo-success); }
    .rp-badge.B { background: var(--neo-info-bg); color: var(--neo-info-fg); }
    .rp-badge.C { background: var(--neo-warning-bg); color: var(--neo-warning); }
    .rp-badge.F { background: var(--neo-danger-bg); color: var(--neo-danger); }
    .rp-badge.q { background: var(--neo-bg-elevated); color: var(--neo-fg-muted); }

    .rp-ev-chip { display: inline-block; padding: 2px 6px; border-radius: var(--neo-r-xs); font-size: 9px; font-weight: var(--neo-fw-bold); margin: 1px; background: var(--neo-danger-bg); color: var(--neo-danger-fg); }
  </style>
</head>
<body>

  <div class="rp-shell-skel" id="bootSkeleton"><div class="spinner"></div><div>جاري التحميل…</div></div>

  <div id="neoAppRoot" style="display:none;">
    <main id="neoContent">

      <div class="rp-header">
        <div>
          <h1 class="rp-header-title">🗺️ الخريطة والتقارير</h1>
          <div class="rp-header-sub">تحليل جغرافي وتقني لجودة الترافيك</div>
        </div>
      </div>

      <div class="rp-filters">
        <div class="rp-filter-field">
          <label class="rp-filter-label">من تاريخ</label>
          <input type="date" id="rpFrom" class="neo-input neo-input-sm">
        </div>
        <div class="rp-filter-field">
          <label class="rp-filter-label">إلى تاريخ</label>
          <input type="date" id="rpTo" class="neo-input neo-input-sm">
        </div>
        <div style="display:flex;gap:4px;">
          <button class="neo-btn neo-btn-primary neo-btn-sm" id="rpApplyBtn">تطبيق</button>
          <button class="neo-btn neo-btn-ghost neo-btn-sm" id="rpClearBtn">مسح</button>
        </div>
      </div>

      <div class="rp-tabs">
        <button class="rp-tab active" data-tab="map">🗺️ الخريطة الحية</button>
        <button class="rp-tab" data-tab="countries">🌍 الدول</button>
        <button class="rp-tab" data-tab="zones">📊 الزونات</button>
        <button class="rp-tab" data-tab="tech">💻 التقنيات</button>
      </div>

      <!-- Map -->
      <div class="rp-panel active" data-panel="map">
        <div id="rpMap"></div>
        <div class="rp-map-stats" id="rpMapStats">—</div>
      </div>

      <!-- Countries -->
      <div class="rp-panel" data-panel="countries">
        <div class="rp-grid-2">
          <div class="rp-card">
            <h3 class="rp-card-title">أعلى 10 دول</h3>
            <div class="rp-chart-wrap"><canvas id="rpCountryChart"></canvas></div>
          </div>
          <div class="neo-table-wrap">
            <table class="neo-table">
              <thead>
                <tr>
                  <th>الدولة</th>
                  <th class="neo-cell-center">الكود</th>
                  <th class="neo-cell-center">إجمالي</th>
                  <th class="neo-cell-center" style="color:var(--neo-success);">صالح</th>
                  <th class="neo-cell-center" style="color:var(--neo-danger);">Bot %</th>
                </tr>
              </thead>
              <tbody id="rpCountriesBody">
                <tr><td colspan="5" class="neo-table-empty">جاري التحميل…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Zones -->
      <div class="rp-panel" data-panel="zones">
        <div class="neo-table-wrap">
          <table class="neo-table">
            <thead>
              <tr>
                <th>المنطقة</th>
                <th class="neo-cell-center">إجمالي</th>
                <th class="neo-cell-center" style="color:var(--neo-success);">صالح</th>
                <th class="neo-cell-center" style="color:var(--neo-warning);">مشبوه</th>
                <th class="neo-cell-center" style="color:var(--neo-danger);">غير صالح</th>
                <th class="neo-cell-center">Bot %</th>
                <th class="neo-cell-center">الدرجة</th>
                <th>أشهر الإشارات</th>
              </tr>
            </thead>
            <tbody id="rpZonesBody">
              <tr><td colspan="8" class="neo-table-empty">جاري التحميل…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tech -->
      <div class="rp-panel" data-panel="tech">
        <div class="rp-grid-2">
          <div class="rp-card">
            <h3 class="rp-card-title">الأجهزة</h3>
            <div class="rp-chart-wrap"><canvas id="rpDeviceChart"></canvas></div>
          </div>
          <div class="rp-card">
            <h3 class="rp-card-title">المتصفحات</h3>
            <div class="rp-chart-wrap"><canvas id="rpBrowserChart"></canvas></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="/static/js/neo-shell.js"></script>
  <script>
    const RP = {
      filters: { from: '', to: '' },
      map: null,
      cluster: null,
      charts: {},
    };

    function esc(s) { return Neo.escape(s); }
    function fmtInt(n) { return Number(n || 0).toLocaleString('en-US'); }

    const EVIDENCE_LABELS = {
      WEBDRIVER_FLAG: 'WebDriver', CDP_DETECTED: 'CDP',
      WINDOWS_UA_LINUX: 'OS تضارب', FIREFOX_CHROME_OBJ: 'Firefox+Chrome',
      BOT_UA: 'UA بوت', VPN_DATACENTER: 'VPN+DC',
      WEBRTC_LEAK: 'WebRTC Leak', PLUGINS_ZERO: 'plugins=0',
      CHROME_NO_OBJ: 'window.chrome', FINGERPRINT_REUSE_HIGH: 'بصمة متكررة',
      ROBOTIC_LINEAR: 'ماوس خطي', DATACENTER_IP: 'Datacenter',
      VPN_PROXY: 'VPN', CANVAS_MISSING: 'Canvas مفقود',
      UTC_TZ: 'UTC', ZOMBIE: 'بدون تفاعل',
    };
    function evLabel(code) { return EVIDENCE_LABELS[code] || code; }

    function buildQuery() {
      const p = new URLSearchParams();
      if (RP.filters.from) p.set('from_date', RP.filters.from);
      if (RP.filters.to) p.set('to_date', RP.filters.to);
      return p.toString();
    }

    // =========================================================
    // MAP
    // =========================================================
    async function loadMap() {
      if (!RP.map) {
        RP.map = L.map('rpMap').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(RP.map);
      }

      if (RP.cluster) { RP.map.removeLayer(RP.cluster); RP.cluster = null; }

      RP.cluster = L.markerClusterGroup({
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
      });

      try {
        const q = buildQuery();
        const data = await Neo.api('/api/map/visits' + (q ? '?' + q : ''));

        data.forEach(v => {
          const color = v.verdict === 'valid' ? '#10B981' : v.verdict === 'invalid' ? '#EF4444' : '#F59E0B';
          const marker = L.circleMarker([v.lat, v.lng], {
            radius: 6, fillColor: color, color: '#fff', weight: 1, opacity: 1, fillOpacity: 0.85,
          });
          marker.bindPopup(`<b>${esc(v.country)}</b><br>IP: ${esc(v.ip)}<br>Status: <b>${esc((v.verdict || '').toUpperCase())}</b>`);
          RP.cluster.addLayer(marker);
        });

        RP.map.addLayer(RP.cluster);
        document.getElementById('rpMapStats').textContent = `${fmtInt(data.length)} زيارة معروضة على الخريطة (بحد أقصى 1000)`;
      } catch (e) {
        document.getElementById('rpMapStats').textContent = 'فشل تحميل الزيارات: ' + e.message;
      }
    }

    // =========================================================
    // COUNTRIES
    // =========================================================
    async function loadCountries() {
      try {
        const q = buildQuery();
        const data = await Neo.api('/api/reports/countries' + (q ? '?' + q : ''));

        if (RP.charts.country) { try { RP.charts.country.destroy(); } catch (e) {} }

        const top = data.slice(0, 10);
        RP.charts.country = new Chart(document.getElementById('rpCountryChart').getContext('2d'), {
          type: 'bar',
          data: {
            labels: top.map(d => d.code || d.name),
            datasets: [
              { label: 'صالح', data: top.map(d => d.valid), backgroundColor: '#10B981', stack: 'v', borderRadius: 3 },
              { label: 'مشبوه', data: top.map(d => d.suspicious), backgroundColor: '#F59E0B', stack: 'v', borderRadius: 3 },
              { label: 'بوتات', data: top.map(d => d.invalid), backgroundColor: '#EF4444', stack: 'v', borderRadius: 3 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#B0B8C4', font: { family: 'Inter' } } } },
            scales: {
              x: { stacked: true, ticks: { color: '#B0B8C4' }, grid: { color: 'rgba(255,255,255,0.04)' } },
              y: { stacked: true, ticks: { color: '#B0B8C4' }, grid: { color: 'rgba(255,255,255,0.04)' } },
            },
          },
        });

        const tbody = document.getElementById('rpCountriesBody');
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="neo-table-empty">لا توجد بيانات</td></tr>';
          return;
        }
        tbody.innerHTML = data.map(d => `
          <tr>
            <td style="font-weight: 700; color: var(--neo-fg-primary);">${esc(d.name)}</td>
            <td class="neo-cell-center neo-mono neo-accent-hover" style="color: var(--neo-accent-hover);">${esc(d.code || '—')}</td>
            <td class="neo-cell-center neo-mono">${fmtInt(d.total)}</td>
            <td class="neo-cell-center neo-mono" style="color: var(--neo-success);">${fmtInt(d.valid)}</td>
            <td class="neo-cell-center neo-mono" style="color: ${d.bot_rate > 30 ? 'var(--neo-danger)' : d.bot_rate > 15 ? 'var(--neo-warning)' : 'var(--neo-success)'}; font-weight: 800;">${d.bot_rate}%</td>
          </tr>
        `).join('');
      } catch (e) { console.error('[RP] countries failed:', e); }
    }

    // =========================================================
    // ZONES
    // =========================================================
    async function loadZones() {
      try {
        const q = buildQuery();
        const data = await Neo.api('/api/reports/zones' + (q ? '?' + q : ''));

        const tbody = document.getElementById('rpZonesBody');
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="8" class="neo-table-empty">لا توجد بيانات</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(z => {
          const evChips = (z.top_evidence || []).slice(0, 3).map(e =>
            `<span class="rp-ev-chip">${esc(evLabel(e.code))} ×${e.count}</span>`
          ).join('') || '<span style="color: var(--neo-fg-muted); font-size: 10px;">—</span>';

          return `
            <tr>
              <td class="neo-mono neo-fg-primary neo-font-bold">${esc(z.zone)}</td>
              <td class="neo-cell-center neo-mono">${fmtInt(z.total)}</td>
              <td class="neo-cell-center neo-mono" style="color: var(--neo-success);">${fmtInt(z.valid)}</td>
              <td class="neo-cell-center neo-mono" style="color: var(--neo-warning);">${fmtInt(z.suspicious)}</td>
              <td class="neo-cell-center neo-mono" style="color: var(--neo-danger); font-weight: 800;">${fmtInt(z.invalid)}</td>
              <td class="neo-cell-center neo-mono" style="color: ${z.bot_rate > 30 ? 'var(--neo-danger)' : z.bot_rate > 15 ? 'var(--neo-warning)' : 'var(--neo-success)'}; font-weight: 800;">${z.bot_rate}%</td>
              <td class="neo-cell-center"><span class="rp-badge ${z.grade === '?' ? 'q' : z.grade}">${z.grade}</span></td>
              <td>${evChips}</td>
            </tr>
          `;
        }).join('');
      } catch (e) { console.error('[RP] zones failed:', e); }
    }

    // =========================================================
    // TECH
    // =========================================================
    async function loadTech() {
      try {
        const q = buildQuery();
        const data = await Neo.api('/api/reports/tech' + (q ? '?' + q : ''));

        function mkChart(ctx, items) {
          return new Chart(ctx, {
            type: 'bar',
            data: {
              labels: items.map(d => d.name),
              datasets: [
                { label: 'صالح', data: items.map(d => d.valid), backgroundColor: '#10B981', stack: 'v', borderRadius: 3 },
                { label: 'مشبوه', data: items.map(d => d.suspicious), backgroundColor: '#F59E0B', stack: 'v', borderRadius: 3 },
                { label: 'بوتات', data: items.map(d => d.invalid), backgroundColor: '#EF4444', stack: 'v', borderRadius: 3 },
              ],
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { labels: { color: '#B0B8C4', font: { family: 'Inter' } } } },
              scales: {
                x: { stacked: true, ticks: { color: '#B0B8C4' }, grid: { color: 'rgba(255,255,255,0.04)' } },
                y: { stacked: true, ticks: { color: '#B0B8C4' }, grid: { color: 'rgba(255,255,255,0.04)' } },
              },
            },
          });
        }

        if (RP.charts.device) { try { RP.charts.device.destroy(); } catch (e) {} }
        if (RP.charts.browser) { try { RP.charts.browser.destroy(); } catch (e) {} }

        RP.charts.device = mkChart(document.getElementById('rpDeviceChart').getContext('2d'), data.devices);
        RP.charts.browser = mkChart(document.getElementById('rpBrowserChart').getContext('2d'), data.browsers);
      } catch (e) { console.error('[RP] tech failed:', e); }
    }

    // =========================================================
    // TABS
    // =========================================================
    function switchTab(tab) {
      document.querySelectorAll('.rp-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      document.querySelectorAll('.rp-panel').forEach(p => {
        p.classList.toggle('active', p.dataset.panel === tab);
      });

      if (tab === 'map') setTimeout(loadMap, 100);
      else if (tab === 'countries') loadCountries();
      else if (tab === 'zones') loadZones();
      else if (tab === 'tech') loadTech();
    }

    // =========================================================
    // BIND
    // =========================================================
    function bindControls() {
      document.querySelectorAll('.rp-tab').forEach(t => {
        t.addEventListener('click', () => switchTab(t.dataset.tab));
      });

      document.getElementById('rpApplyBtn').addEventListener('click', () => {
        RP.filters.from = document.getElementById('rpFrom').value;
        RP.filters.to = document.getElementById('rpTo').value;
        const tab = document.querySelector('.rp-tab.active').dataset.tab;
        switchTab(tab);
      });

      document.getElementById('rpClearBtn').addEventListener('click', () => {
        document.getElementById('rpFrom').value = '';
        document.getElementById('rpTo').value = '';
        RP.filters = { from: '', to: '' };
        const tab = document.querySelector('.rp-tab.active').dataset.tab;
        switchTab(tab);
      });
    }

    (async function boot() {
      try {
        await Neo.mount({ active: 'reports', lang: 'ar', breadcrumb: [{ label: 'الخريطة والتقارير' }] });
        document.getElementById('bootSkeleton').style.display = 'none';
        document.getElementById('neoAppRoot').style.display = '';

        bindControls();
        loadMap();

      } catch (e) {
        console.error('[RP Boot] failed:', e);
        document.getElementById('bootSkeleton').innerHTML = `<div style="color: var(--neo-danger);">فشل: ${Neo.escape(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
