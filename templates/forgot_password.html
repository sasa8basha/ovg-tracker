<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · استعادة كلمة المرور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/neo/tokens.css">
  <link rel="stylesheet" href="/static/css/neo/utilities.css">
  <link rel="stylesheet" href="/static/css/neo/components.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--neo-bg-canvas);
      font-family: 'Inter', 'IBM Plex Sans Arabic', system-ui, sans-serif;
      color: var(--neo-fg-secondary);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--neo-sp-4);
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245,158,11,0.10) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(239,68,68,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .fp-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .fp-card {
      background: var(--neo-bg-surface);
      border: 1px solid var(--neo-border-default);
      border-radius: var(--neo-r-xl);
      padding: var(--neo-sp-8) var(--neo-sp-6);
      box-shadow: var(--neo-shadow-xl);
      position: relative;
      overflow: hidden;
    }

    .fp-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--neo-warning), var(--neo-danger), var(--neo-warning));
      opacity: 0.8;
    }

    .fp-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: var(--neo-sp-3);
      margin-bottom: var(--neo-sp-6);
      text-align: center;
    }

    .fp-logo {
      width: 72px;
      height: 72px;
      border-radius: var(--neo-r-lg);
      background: linear-gradient(135deg, var(--neo-warning), var(--neo-danger));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 0 24px rgba(245,158,11,0.35);
    }

    .fp-title {
      font-size: var(--neo-fs-2xl);
      font-weight: var(--neo-fw-black);
      color: var(--neo-fg-primary);
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.1;
    }

    .fp-subtitle {
      font-size: var(--neo-fs-sm);
      color: var(--neo-fg-tertiary);
      margin: 0;
      line-height: 1.6;
    }

    /* Progress indicator */
    .fp-progress {
      display: flex;
      align-items: center;
      gap: var(--neo-sp-2);
      margin-bottom: var(--neo-sp-6);
      justify-content: center;
    }

    .fp-step {
      display: flex;
      align-items: center;
      gap: var(--neo-sp-2);
    }

    .fp-step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--neo-bg-canvas);
      border: 2px solid var(--neo-border-default);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--neo-font-mono);
      font-size: var(--neo-fs-xs);
      font-weight: var(--neo-fw-extrabold);
      color: var(--neo-fg-muted);
      transition: all var(--neo-dur-fast);
    }

    .fp-step-dot.active {
      background: var(--neo-warning);
      border-color: var(--neo-warning);
      color: white;
      box-shadow: 0 0 12px rgba(245,158,11,0.4);
    }

    .fp-step-dot.done {
      background: var(--neo-success);
      border-color: var(--neo-success);
      color: white;
    }

    .fp-step-line {
      width: 32px;
      height: 2px;
      background: var(--neo-border-default);
      border-radius: 1px;
      transition: background var(--neo-dur-fast);
    }

    .fp-step-line.done {
      background: var(--neo-success);
    }

    /* Form */
    .fp-form {
      display: flex;
      flex-direction: column;
      gap: var(--neo-sp-3);
    }

    .fp-form .neo-field {
      margin: 0;
    }

    /* OTP Input */
    .fp-otp-input {
      text-align: center;
      font-family: var(--neo-font-mono);
      font-size: 24px;
      letter-spacing: 12px;
      font-weight: var(--neo-fw-extrabold);
      padding-left: 12px;
    }

    /* Messages */
    .fp-msg {
      padding: var(--neo-sp-2) var(--neo-sp-3);
      border-radius: var(--neo-r-sm);
      font-size: var(--neo-fs-xs);
      display: none;
      text-align: center;
      line-height: 1.6;
      border: 1px solid;
    }

    .fp-msg.error {
      background: var(--neo-danger-bg);
      border-color: var(--neo-danger-border);
      color: var(--neo-danger-fg);
    }

    .fp-msg.success {
      background: var(--neo-success-bg);
      border-color: var(--neo-success-border);
      color: var(--neo-success-fg);
    }

    .fp-msg.info {
      background: var(--neo-info-bg);
      border-color: var(--neo-info-border);
      color: var(--neo-info-fg);
    }

    .fp-msg.visible {
      display: block;
    }

    /* Submit */
    .fp-submit {
      height: 44px;
      background: linear-gradient(135deg, var(--neo-warning), #D97706);
      color: white;
      border: none;
      border-radius: var(--neo-r-md);
      font-family: inherit;
      font-size: var(--neo-fs-md);
      font-weight: var(--neo-fw-extrabold);
      cursor: pointer;
      transition: all var(--neo-dur-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--neo-sp-2);
      margin-top: var(--neo-sp-2);
      box-shadow: 0 0 24px rgba(245,158,11,0.3);
    }

    .fp-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 0 32px rgba(245,158,11,0.5);
    }

    .fp-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .fp-submit.loading::before {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid currentColor;
      border-top-color: transparent;
      animation: fp-spin 600ms linear infinite;
    }

    @keyframes fp-spin {
      to { transform: rotate(360deg); }
    }

    /* Back link */
    .fp-back {
      text-align: center;
      margin-top: var(--neo-sp-4);
      font-size: var(--neo-fs-xs);
    }

    .fp-back a {
      color: var(--neo-accent-hover);
      text-decoration: none;
      font-weight: var(--neo-fw-bold);
    }

    .fp-back a:hover {
      color: var(--neo-accent);
    }

    /* Success block */
    .fp-success-block {
      text-align: center;
      padding: var(--neo-sp-4) 0;
    }

    .fp-success-icon {
      font-size: 56px;
      margin-bottom: var(--neo-sp-3);
      display: block;
    }

    .fp-success-title {
      font-size: var(--neo-fs-lg);
      font-weight: var(--neo-fw-extrabold);
      color: var(--neo-fg-primary);
      margin-bottom: var(--neo-sp-2);
    }

    .fp-success-msg {
      font-size: var(--neo-fs-sm);
      color: var(--neo-fg-tertiary);
      line-height: 1.7;
    }

    @media (max-width: 500px) {
      .fp-card {
        padding: var(--neo-sp-6) var(--neo-sp-4);
      }
      .fp-logo {
        width: 60px;
        height: 60px;
        font-size: 30px;
      }
      .fp-title {
        font-size: var(--neo-fs-xl);
      }
    }
  </style>
</head>
<body>

  <div class="fp-container">
    <div class="fp-card">

      <!-- Brand -->
      <div class="fp-brand">
        <div class="fp-logo">🔐</div>
        <h1 class="fp-title">استعادة الحساب</h1>
        <p class="fp-subtitle" id="fpSubtitle">هنبعتلك كود مكون من 6 أرقام لتغيير الباسورد</p>
      </div>

      <!-- Progress -->
      <div class="fp-progress" id="fpProgress">
        <div class="fp-step">
          <div class="fp-step-dot active" id="step1Dot">1</div>
        </div>
        <div class="fp-step-line" id="stepLine"></div>
        <div class="fp-step">
          <div class="fp-step-dot" id="step2Dot">2</div>
        </div>
      </div>

      <!-- Step 1: Email -->
      <div id="stepEmail">
        <form class="fp-form" onsubmit="FP.submitEmail(event)">
          <div class="neo-field">
            <label class="neo-field-label neo-field-label-required" for="fpEmail">البريد الإلكتروني المسجل</label>
            <input
              type="email"
              id="fpEmail"
              class="neo-input"
              placeholder="you@example.com"
              required
              autocomplete="email"
              maxlength="254">
          </div>

          <div class="fp-msg" id="msg1"></div>

          <button type="submit" class="fp-submit" id="btnSendEmail">
            <span id="btnSendText">إرسال الكود</span>
          </button>
        </form>
      </div>

      <!-- Step 2: OTP + New Password -->
      <div id="stepReset" style="display:none;">
        <form class="fp-form" onsubmit="FP.submitReset(event)">
          <div class="neo-field">
            <label class="neo-field-label neo-field-label-required" for="fpOtp">كود التحقق (من الإيميل)</label>
            <input
              type="text"
              id="fpOtp"
              class="neo-input fp-otp-input"
              placeholder="000000"
              required
              maxlength="6"
              inputmode="numeric"
              pattern="\d{6}"
              autocomplete="one-time-code">
            <span class="neo-field-hint">الكود صالح لمدة ساعة واحدة</span>
          </div>

          <div class="neo-field">
            <label class="neo-field-label neo-field-label-required" for="fpNewPassword">كلمة المرور الجديدة</label>
            <input
              type="password"
              id="fpNewPassword"
              class="neo-input"
              placeholder="••••••••"
              required
              minlength="8"
              maxlength="128"
              autocomplete="new-password">
            <span class="neo-field-hint">8 حروف على الأقل، وتحتوي على حرفين مختلفين (كبير/صغير/رقم/رمز)</span>
          </div>

          <div class="neo-field">
            <label class="neo-field-label neo-field-label-required" for="fpConfirmPassword">تأكيد كلمة المرور</label>
            <input
              type="password"
              id="fpConfirmPassword"
              class="neo-input"
              placeholder="••••••••"
              required
              autocomplete="new-password"
              maxlength="128">
          </div>

          <div class="fp-msg" id="msg2"></div>

          <button type="submit" class="fp-submit" id="btnReset">
            <span id="btnResetText">تغيير كلمة المرور</span>
          </button>
        </form>
      </div>

      <!-- Success block -->
      <div id="stepSuccess" style="display:none;">
        <div class="fp-success-block">
          <span class="fp-success-icon">🎉</span>
          <div class="fp-success-title">تم إعادة التعيين</div>
          <div class="fp-success-msg">باقي الأجهزة اتسجلت خروج.<br>جاري تحويلك للداشبورد...</div>
        </div>
      </div>

      <!-- Back link -->
      <div class="fp-back" id="fpBack" style="display:none;">
        <a href="/">← رجوع لتسجيل الدخول</a>
      </div>

      <div class="fp-back">
        <a href="/">← رجوع لتسجيل الدخول</a>
      </div>

    </div>
  </div>

  <script>
    const FP = {
      step: 1,
      userEmail: '',
      loading: false,
    };

    FP.showMsg = function(elId, type, msg) {
      const el = document.getElementById(elId);
      if (!msg) {
        el.className = 'fp-msg';
        el.textContent = '';
        return;
      }
      el.className = 'fp-msg ' + type + ' visible';
      el.textContent = msg;
    };

    FP.setLoading = function(btnId, loading, defaultText) {
      FP.loading = loading;
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.classList.toggle('loading', loading);
      const textEl = btn.querySelector('span');
      if (textEl) textEl.textContent = loading ? 'جاري...' : defaultText;
    };

    FP.goToStep = function(step) {
      FP.step = step;
      document.getElementById('stepEmail').style.display = step === 1 ? '' : 'none';
      document.getElementById('stepReset').style.display = step === 2 ? '' : 'none';
      document.getElementById('stepSuccess').style.display = step === 3 ? '' : 'none';

      // Progress
      const dot1 = document.getElementById('step1Dot');
      const dot2 = document.getElementById('step2Dot');
      const line = document.getElementById('stepLine');

      dot1.className = 'fp-step-dot' + (step >= 2 ? ' done' : step === 1 ? ' active' : '');
      dot2.className = 'fp-step-dot' + (step >= 3 ? ' done' : step === 2 ? ' active' : '');
      line.className = 'fp-step-line' + (step >= 2 ? ' done' : '');

      // Subtitle
      const subtitleEl = document.getElementById('fpSubtitle');
      if (step === 1) subtitleEl.textContent = 'هنبعتلك كود مكون من 6 أرقام لتغيير الباسورد';
      else if (step === 2) subtitleEl.textContent = 'ادخل الكود اللي وصلك في الإيميل واختار كلمة مرور جديدة';
      else subtitleEl.textContent = '';
    };

    FP.submitEmail = async function(e) {
      e.preventDefault();
      if (FP.loading) return;

      FP.showMsg('msg1', '', '');

      const email = (document.getElementById('fpEmail').value || '').trim();
      if (!email || !email.includes('@')) {
        FP.showMsg('msg1', 'error', 'بريد إلكتروني صحيح مطلوب');
        return;
      }

      FP.userEmail = email;
      FP.setLoading('btnSendEmail', true, 'إرسال الكود');

      try {
        const r = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
          credentials: 'same-origin',
        });

        const data = await r.json().catch(() => ({}));

        if (r.ok) {
          // Move to step 2 regardless — even if email not registered,
          // we don't reveal that for security
          FP.goToStep(2);
          setTimeout(() => document.getElementById('fpOtp').focus(), 100);
          FP.setLoading('btnSendEmail', false, 'إرسال الكود');
        } else {
          FP.showMsg('msg1', 'error', data.detail || 'حدث خطأ');
          FP.setLoading('btnSendEmail', false, 'إرسال الكود');
        }
      } catch (err) {
        FP.showMsg('msg1', 'error', 'خطأ في الاتصال: ' + err.message);
        FP.setLoading('btnSendEmail', false, 'إرسال الكود');
      }
    };

    FP.submitReset = async function(e) {
      e.preventDefault();
      if (FP.loading) return;

      FP.showMsg('msg2', '', '');

      const otp = (document.getElementById('fpOtp').value || '').trim();
      const newPw = document.getElementById('fpNewPassword').value || '';
      const confirmPw = document.getElementById('fpConfirmPassword').value || '';

      if (!/^\d{6}$/.test(otp)) {
        FP.showMsg('msg2', 'error', 'الكود لازم 6 أرقام');
        return;
      }
      if (!newPw || newPw.length < 8) {
        FP.showMsg('msg2', 'error', 'كلمة المرور لازم 8 حروف على الأقل');
        return;
      }
      if (newPw !== confirmPw) {
        FP.showMsg('msg2', 'error', 'كلمتا المرور غير متطابقتين');
        return;
      }

      FP.setLoading('btnReset', true, 'تغيير كلمة المرور');

      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: FP.userEmail,
            otp: otp,
            new_password: newPw,
          }),
          credentials: 'same-origin',
        });

        const data = await r.json().catch(() => ({}));

        if (r.ok) {
          FP.goToStep(3);
          setTimeout(() => { window.location.href = '/v2/dashboard'; }, 1800);
        } else {
          FP.showMsg('msg2', 'error', data.detail || 'الكود غلط أو منتهي');
          FP.setLoading('btnReset', false, 'تغيير كلمة المرور');
        }
      } catch (err) {
        FP.showMsg('msg2', 'error', 'خطأ في الاتصال: ' + err.message);
        FP.setLoading('btnReset', false, 'تغيير كلمة المرور');
      }
    };

    // Auto-focus email
    setTimeout(() => {
      const el = document.getElementById('fpEmail');
      if (el) el.focus();
    }, 100);
  </script>
</body>
</html>
