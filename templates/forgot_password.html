<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVG · استعادة كلمة المرور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Cairo',sans-serif;background:#0F172A;color:#F1F5F9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .card{background:#1E293B;border:1px solid #334155;border-radius:24px;padding:32px;width:100%;max-width:440px}
    .input{width:100%;padding:12px 16px;border:1.5px solid #334155;border-radius:12px;font-size:15px;background:#0F172A;color:#F1F5F9;margin-top:6px;box-sizing:border-box;font-family:'Cairo',sans-serif;text-align:center}
    .input:focus{outline:none;border-color:#6366F1;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
    .btn{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;padding:13px;border-radius:12px;font-weight:700;width:100%;border:none;cursor:pointer;font-size:15px;font-family:'Cairo',sans-serif;margin-top:12px}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    label{font-size:13px;color:#CBD5E1;font-weight:600;display:block;text-align:right;}
    .msg{padding:12px;border-radius:10px;font-size:13px;text-align:center;margin-bottom:16px;display:none}
    .msg-ok{background:rgba(16,185,129,.1);color:#10B981;border:1px solid rgba(16,185,129,.3)}
    .msg-err{background:rgba(244,63,94,.1);color:#F43F5E;border:1px solid rgba(244,63,94,.2)}
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:36px">🔐</div>
      <h1 style="font-size:22px;font-weight:800;margin:0">استعادة الحساب</h1>
      <p style="color:#94A3B8;font-size:13px;margin:8px 0 0;line-height:1.6">هنبعتلك كود مكون من 6 أرقام لتغيير الباسورد.</p>
    </div>

    <!-- Step 1: Email -->
    <div id="stepEmail">
      <form id="formEmail" style="display:flex;flex-direction:column;gap:14px">
        <div>
          <label>البريد الإلكتروني المسجل</label>
          <input name="email" type="email" class="input" placeholder="you@example.com" required>
        </div>
        <p id="msg1" class="msg"></p>
        <button type="submit" id="btnSend" class="btn">إرسال الكود</button>
      </form>
    </div>

    <!-- Step 2: OTP & New Password -->
    <div id="stepReset" style="display:none">
      <form id="formReset" style="display:flex;flex-direction:column;gap:14px">
        <div>
          <label>كود التحقق (من الإيميل)</label>
          <input name="otp" type="text" class="input" placeholder="123456" required maxlength="6" pattern="\d{6}" style="font-size:20px;letter-spacing:4px;font-family:monospace;">
        </div>
        <div>
          <label>كلمة المرور الجديدة</label>
          <input name="new_password" type="password" class="input" placeholder="••••••••" required minlength="8" style="text-align:right;letter-spacing:normal;">
        </div>
        <p id="msg2" class="msg"></p>
        <button type="submit" id="btnReset" class="btn">تغيير كلمة المرور</button>
      </form>
    </div>

    <a href="/" style="display:block;text-align:center;color:#818CF8;font-size:13px;text-decoration:none;margin-top:20px">← رجوع لتسجيل الدخول</a>
  </div>

  <script>
    let userEmail = '';

    function showMsg(el, ok, text) {
      el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
      el.textContent = text;
      el.style.display = 'block';
    }

    // الخطوة 1: إرسال الكود
    document.getElementById('formEmail').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSend');
      const msg = document.getElementById('msg1');
      btn.disabled = true; msg.style.display = 'none';
      
      const fd = new FormData(e.target);
      userEmail = fd.get('email').trim();

      try {
        const r = await fetch('/api/auth/forgot-password', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email: userEmail })
        });
        const d = await r.json().catch(()=>({}));
        
        if (r.ok) {
          document.getElementById('stepEmail').style.display = 'none';
          document.getElementById('stepReset').style.display = 'block';
        } else {
          showMsg(msg, false, d.detail || 'حدث خطأ');
          btn.disabled = false;
        }
      } catch(err) {
        showMsg(msg, false, 'خطأ في الاتصال');
        btn.disabled = false;
      }
    });

    // الخطوة 2: تغيير الباسورد بالكود
    document.getElementById('formReset').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnReset');
      const msg = document.getElementById('msg2');
      btn.disabled = true; msg.style.display = 'none';

      const fd = new FormData(e.target);
      const otp = fd.get('otp').trim();
      const new_password = fd.get('new_password');

      try {
        const r = await fetch('/api/auth/reset-password', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email: userEmail, otp: otp, new_password: new_password })
        });
        const d = await r.json().catch(()=>({}));
        
        if (r.ok) {
          showMsg(msg, true, d.message || 'تم التغيير بنجاح، جاري تحويلك...');
          setTimeout(() => location.href = '/dashboard', 1500);
        } else {
          showMsg(msg, false, d.detail || 'الكود غلط أو منتهي');
          btn.disabled = false;
        }
      } catch(err) {
        showMsg(msg, false, 'خطأ في الاتصال');
        btn.disabled = false;
      }
    });
  </script>
</body>
  </html>
